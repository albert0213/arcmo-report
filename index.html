<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#101317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arcmo 리포트 · 2026.09.10</title>
<style>
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f7f8fa; --surface3:#eceef2;
  --line:#dfe3ea; --line2:#eef1f5;
  --ink:#13161b; --ink2:#59616e; --ink3:#8d95a3;
  --accent:#1f5fd0; --accent-soft:#e7eefc; --accent-ink:#ffffff;
  --danger:#c0392b; --danger-soft:#fdeceb;
  --ok:#1c7a52; --warn:#9a6212;
  --s1:#3B6FE0; --s2:#E0662B;
  --shadow:0 1px 2px rgba(16,20,28,.06),0 6px 20px rgba(16,20,28,.06);
  --shadow2:0 10px 40px rgba(16,20,28,.18);
  --r:14px; --r2:10px;
  --appbar:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1013; --surface:#171a1f; --surface2:#1d2127; --surface3:#242931;
    --line:#2b3038; --line2:#22262d;
    --ink:#e9ecf1; --ink2:#a3abb8; --ink3:#727b89;
    --accent:#5b8ef0; --accent-soft:#1a2740; --accent-ink:#0b0e12;
    --danger:#e8705f; --danger-soft:#2c1a18;
    --ok:#4cc08a; --warn:#d8a552;
    --s1:#5F8FE6; --s2:#CE7A45;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    --shadow2:0 10px 40px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--accent)}
.hide{display:none !important}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.mono{font-variant-numeric:tabular-nums}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.wrapx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── 버튼 ───────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:var(--r2);
  background:var(--surface);border:1px solid var(--line);
  font-weight:600;font-size:14px;color:var(--ink);
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface3)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{min-height:52px;font-size:16px;padding:0 22px}
.btn.block{width:100%}
.iconbtn{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink2);flex:none
}
.iconbtn:hover{background:var(--surface3)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:26px;height:26px}

/* ── 입력 ───────────────────────────── */
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 6px 2px;letter-spacing:.01em}
.inp{
  width:100%;min-height:46px;padding:10px 13px;border-radius:var(--r2);
  background:var(--surface2);border:1px solid var(--line);outline:none;
}
.inp:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{appearance:none;background-image:none}

/* ── 카드 ───────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.sect-t{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;margin:0 0 10px 2px}

/* ── 로그인 ─────────────────────────── */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);z-index:60;overflow:auto}
.loginbox{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brandmark{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brandtxt b{display:block;font-size:19px;letter-spacing:-.02em}
.brandtxt span{font-size:12.5px;color:var(--ink2)}
.fields{display:flex;flex-direction:column;gap:14px}
.hintline{font-size:12.5px;color:var(--ink2);margin-top:7px;display:flex;gap:6px;align-items:flex-start}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink2);cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
details.adv{margin-top:4px;border-top:1px solid var(--line2);padding-top:12px}
details.adv summary{cursor:pointer;font-size:13px;color:var(--ink2);font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸";transition:transform .15s;display:inline-block}
details.adv[open] summary::before{transform:rotate(90deg)}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1px}
.err:empty{display:none}

/* ── 앱 셸 ──────────────────────────── */
#app{display:none;height:100dvh;flex-direction:column;overflow:hidden}
#app.on{display:flex}
.appbar{
  z-index:30;height:var(--appbar);flex:none;
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);height:calc(var(--appbar) + env(safe-area-inset-top));
}
.appbar .title{font-weight:700;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.appbar .brandmark{width:30px;height:30px;border-radius:8px;font-size:14px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:0 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--danger)}

.scrim{position:fixed;inset:0;background:rgba(6,9,14,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:272px;z-index:41;
  background:var(--surface);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .22s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)
}
.drawer.on{transform:none}
.drawer .who{padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.drawer .who b{display:block;font-size:16px}
.drawer .who span{font-size:12.5px;color:var(--ink2)}
.navlist{padding:10px;overflow:auto;flex:1}
.navitem{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink2);text-align:left
}
.navitem:hover{background:var(--surface3)}
.navitem.on{background:var(--accent-soft);color:var(--accent)}
.navitem[disabled]{opacity:.4}
.navitem small{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3)}
.navsep{height:1px;background:var(--line2);margin:8px 6px}

main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;min-height:0;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch}
.view.on{display:flex}
#v-capture{overflow:hidden}
.pad{padding:16px}
.maxw{width:100%;max-width:1180px;margin:0 auto}

/* ── 2단 레이아웃 ───────────────────── */
.split{display:flex;flex:1;min-height:0}
.split>.pane-l{width:360px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.split>.pane-r{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:auto}
@media (max-width:899px){
  .split>.pane-l{width:100%;border-right:0}
  .split.detail>.pane-l{display:none}
  .split:not(.detail)>.pane-r{display:none}
}
.paneheadrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2);flex:none}
/* 뒤로가기 버튼의 표시 여부는 JS(updateBack)가 결정합니다 */

/* ── 리스트 ─────────────────────────── */
.listwrap{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.lrow{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;
  border-bottom:1px solid var(--line2);text-align:left;min-height:60px
}
.lrow:hover{background:var(--surface2)}
.lrow.on{background:var(--accent-soft)}
.lrow .num{width:34px;flex:none;text-align:center;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.lrow .nm{display:block;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .meta{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.empty{padding:44px 22px;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.6;margin-bottom:10px}

/* 팀 선택 바 */
.teambar{padding:12px;border-bottom:1px solid var(--line2);flex:none;background:var(--surface)}
.teampick{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface2);text-align:left}
.teampick b{font-size:15.5px;font-weight:700}
.teampick .cnt{margin-left:auto;font-size:12px;color:var(--ink3)}
.searchrow{margin-top:9px;position:relative}
.searchrow svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.searchrow input{padding-left:34px;min-height:40px}

/* ── 선수 상세 ──────────────────────── */
.phead{display:flex;gap:16px;align-items:center;padding:18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.phead .big{width:72px;height:72px;border-radius:50%;font-size:26px}
.phead h2{font-size:24px;letter-spacing:-.02em}
.phead .sub{color:var(--ink2);font-size:13.5px;margin-top:2px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  text-align:left;font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;
  padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0;z-index:1
}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:var(--surface2)}
.tbl .r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface3);color:var(--ink2);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.rrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line2);text-align:left}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--surface2)}
.rrow .d{flex:none;min-width:104px}
.rrow .d b{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.rrow .d span{display:block;font-size:11.5px;color:var(--ink3)}
.rrow .sc{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.rrow .sc b{display:block;font-size:17px;font-weight:800}
.rrow .sc span{display:block;font-size:11px;color:var(--ink3)}
.rrow .go{flex:none;color:var(--ink3)}
@media (max-width:620px){
  .rrow{flex-wrap:wrap;row-gap:10px}
  .rrow .tags{order:3;width:100%}
  .rrow .sc{margin-left:auto}
}

/* ── 홈 기능 그리드 ─────────────────── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:18px}
.fcard{
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:140px;text-align:left;
  box-shadow:var(--shadow);transition:transform .1s,box-shadow .15s
}
.fcard:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
.fcard[disabled]{opacity:.5;box-shadow:none}
.fcard .ic{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fcard b{font-size:15.5px}
.fcard span{font-size:12.5px;color:var(--ink2);line-height:1.45}

/* ── 촬영 ───────────────────────────── */
.stage{background:#000;position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.stage .ph{position:absolute;inset:0;display:grid;place-items:center;color:#8b93a1;text-align:center;padding:24px;font-size:14px}
.recbadge{position:absolute;top:12px;left:12px;display:none;align-items:center;gap:7px;background:rgba(192,57,43,.94);color:#fff;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.recbadge.on{display:flex}
.recbadge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s steps(2,end) infinite}
@keyframes bl{50%{opacity:.15}}
.capbar{flex:none;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.reccircle{width:70px;height:70px;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center;background:var(--surface);justify-self:center}
.reccircle i{width:34px;height:34px;border-radius:50%;background:var(--danger);transition:.16s}
.reccircle.rec i{border-radius:7px;width:26px;height:26px}
.reccircle:disabled{opacity:.4}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}

/* ── 옵션 체크 ──────────────────────── */
.optlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-weight:600;font-size:14.5px;text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt .box{width:21px;height:21px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.opt.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.opt[disabled]{opacity:.45}
.opt small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3);margin-top:1px}

/* ── 진행 단계 ──────────────────────── */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:12px 4px}
.step .mk{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface3);color:var(--ink3)}
.step.ok .mk{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.step.bad .mk{background:var(--danger-soft);color:var(--danger)}
.step.run .mk{background:var(--accent-soft);color:var(--accent)}
.step .nm{font-weight:600;font-size:14.5px}
.step .ms{font-size:12.5px;color:var(--ink3)}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}

/* ── 리포트 ─────────────────────────── */
.rgrid{display:grid;gap:14px;padding:16px;grid-template-columns:1fr}
@media (min-width:980px){.rgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.mcards{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.mcard{
  display:flex;flex-direction:column;gap:4px;padding:15px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);text-align:left;box-shadow:var(--shadow);min-height:104px
}
.mcard.wide{grid-column:1/-1}
.mcard:hover:not([disabled]){border-color:var(--accent)}
.mcard[disabled]{opacity:.5;box-shadow:none}
.mcard .t{font-size:12.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px}
.mcard .t svg{width:14px;height:14px;margin-left:auto;color:var(--ink3)}
.mcard .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:auto}
.mcard .v small{font-size:15px;font-weight:600;color:var(--ink3)}
.mcard .sub{font-size:12px;color:var(--ink3)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:650;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[disabled]{opacity:.38}
.vidbox{background:#000;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9}
.vidbox video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.vidbox .ovl{position:absolute;inset:0;display:grid;place-items:center;color:#9aa2b1;text-align:center;padding:20px;font-size:13.5px;background:#000}
.vidbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.fstep{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.fstep .fnum small{font-weight:600;color:var(--ink3);font-size:12px}
@media (max-width:560px){
  .fstep{gap:4px}
  .fstep .btn{padding:0 9px;font-size:12.5px}
  .fstep .fnum{min-width:0;font-size:12.5px}
  .fstep .fnum small{display:none}      /* 좁은 화면에서는 초 표시를 접습니다 */
}
.fslide{margin-top:10px;padding:0 2px;position:relative}
.fslide input[type=range]{width:100%;height:26px;accent-color:var(--accent);cursor:pointer}
/* 소리로 찾은 임팩트 — 슬라이더 위 세로 마커 */
.fslide .fimp{position:absolute;top:3px;bottom:3px;width:2px;border-radius:2px;
  background:var(--accent);opacity:.8;transform:translateX(-1px);pointer-events:none}
.btn.sm.imp{border-color:var(--accent);color:var(--accent);font-weight:700}

/* 무게중심 — 좌우 비율 막대 */
.wbar-track{position:relative;height:34px;margin-top:4px}
.wbar-fill{display:flex;height:100%;border-radius:999px;overflow:hidden;background:var(--surface3)}
.wbar-fill span{height:100%;transition:width .12s linear}
.wbar-fill span.a{background:linear-gradient(90deg,#e34a34,#f0664a)}
.wbar-fill span.b{background:linear-gradient(90deg,#4a6ee0,#3550b6)}
.wbar-pill{
  position:absolute;top:50%;transform:translate(-50%,-50%);background:#252a35;color:#fff;
  font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;padding:5px 11px;border-radius:9px;
  white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.32);transition:left .12s linear;pointer-events:none
}
.wbar-legend{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.wbar-legend b{display:flex;align-items:center;gap:7px;font-weight:650}
.wbar-legend i{width:11px;height:11px;border-radius:3px;flex:none}
.wbar-legend i.a{background:#e34a34}
.wbar-legend i.b{background:#4a6ee0}
.wbar-legend .sub{color:var(--ink3);font-weight:600;font-size:12px}
.wbar-legend em{font-style:normal;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

/* 그래프 2개를 좌우로 — 가로로 늘어뜨리지 않고 정방형에 가깝게 */
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.chartgrid .chartbox{height:auto;aspect-ratio:1/.92;min-height:230px;max-height:520px}
.fstep .fnum{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--ink2);min-width:92px;text-align:center;padding:0 4px}

/* 3열 균형 테이블 */
.kv{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;font-size:14px;margin-top:8px}
.kv .h{font-size:11.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.kv .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}

/* ── 차트 ───────────────────────────── */
.chartbox{position:relative;width:100%;height:230px;touch-action:pan-y}
.chartbox canvas{width:100%;height:100%;display:block}
.tip{
  position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow2);opacity:0;transition:opacity .1s;
  min-width:118px;z-index:2
}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;color:var(--ink3);font-weight:700;margin-bottom:4px}
.tip .l{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .l i{width:9px;height:9px;border-radius:2px;flex:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend b{display:flex;align-items:center;gap:6px;font-weight:650}
.legend i{width:11px;height:3px;border-radius:2px;flex:none}
.legend i.dash{background:none !important;border-top:2px dashed var(--ink3)}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow2);opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:88vw;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(6,9,14,.45)}
.sheet .panel{

  max-height:86dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow2);padding:20px
}
@media (max-width:640px){
  .sheet .panel{top:auto;bottom:0;left:0;transform:none;width:100%;max-width:none;border-radius:18px 18px 0 0;

<script>
'use strict';
const VERSION = '2.0';

/* ═══════════ 유틸 ═══════════ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const pad2 = n => String(n).padStart(2,'0');

function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), ms||2200);
}
function openSheet(html){
  $('#sheetPanel').innerHTML = html;
  $('#sheet').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click', e => { if (e.target.dataset.close !== undefined) closeSheet(); });

function teamColor(name){
  const t = (S.teams||[]).find(x=>x.name===name);
  if (t && t.color) return t.color;
  let h = 0; for (const c of String(name||'')) h = (h*31 + c.charCodeAt(0)) % 360;
  return 'hsl(' + h + ' 46% 52%)';
}
function initial(s){ return (String(s||'?').trim()[0] || '?'); }
function lrText(lr){
  const p = String(lr||'').split('/');
  const m = x => x==='R'?'우':x==='L'?'좌':x==='B'?'양':'';
  const a = m((p[0]||'').toUpperCase()), b = m((p[1]||'').toUpperCase());
  return (a||b) ? (a+'투'+b+'타') : '-';
}
function batSide(lr){
  const p = String(lr||'').split('/');
  const b = (p[1]||'').toUpperCase();
  return (b==='L'||b==='R') ? b : null;
}
function fmtDur(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+pad2(s%60); }

/* ═══════════ 저장소 ═══════════ */
const LS = {
  get(k,d){ try{ const v = localStorage.getItem('arcmo.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('arcmo.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('arcmo.'+k); }catch(e){} },
};
const srvKeyFor = id => 'server.' + String(id||'').trim().toLowerCase();

/* ═══════════ 상태 ═══════════ */
const S = {
  server:'', user:null, teams:[], players:[], options:[],
  view:'home',
  home:{ team:null, player:null, reports:[], loading:false, q:'' },
  manage:{ team:null },
  ana:{ team:null, player:null, items:new Set(['머리 고정','어깨-골반 회전','무게중심']), q:'' },
  cap:{ streaming:false, recording:false, recorded:false, t0:0, timer:null },
  job:{ pid:null, rid:null, polling:false, stop:false },
  rep:{ pid:null, rid:null, player:null, summary:null, series:null, avail:new Set(), sel:new Set() },
};

function playersOfTeam(name){
  return S.players.filter(p=>p.team===name).sort((a,b)=>(a.number-b.number)||String(a.name).localeCompare(b.name,'ko'));
}
function playerById(id){ return S.players.find(p=>p.id===id) || null; }

/* ═══════════ 통신 ═══════════ */
function url(path){ return S.server.replace(/\/+$/,'') + path; }

async function api(path, opts){
  opts = opts || {};
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), opts.timeout || 15000);
  try{
    const res = await fetch(url(path), {
      method: opts.method || 'GET',
      headers: opts.body ? {'Content-Type':'application/json'} : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: ctrl.signal, cache:'no-store',
    });
    let data = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) { try{ data = await res.json(); }catch(e){ data = null; } }
    else { try{ data = { _text: await res.text() }; }catch(e){ data = null; } }
    if (!res.ok) {
      const msg = (data && (data.error || data.message)) || ('HTTP ' + res.status);
      const err = new Error(msg); err.status = res.status; err.data = data; throw err;
    }
    return data;
  } finally { clearTimeout(to); }
}

let connTimer = null;
function setConn(state, text){
  const d = $('#connDot');
  d.classList.toggle('ok', state==='ok');
  d.classList.toggle('bad', state==='bad');
  $('#connTxt').textContent = text || (state==='ok'?'연결됨':state==='bad'?'끊김':'확인 중');
}
async function pingLoop(){
  clearTimeout(connTimer);
  try { await api('/api/health', {timeout:6000}); setConn('ok','연결됨'); }
  catch(e){ setConn('bad','서버 없음'); }
  connTimer = setTimeout(pingLoop, 20000);
}

/* ═══════════ 네비게이션 ═══════════ */
const TITLES = { home:'홈', manage:'팀 / 선수 관리', analysis:'타격 분석', capture:'촬영',
                 progress:'분석 진행', report:'리포트', detail:'상세', settings:'설정' };

function setDrawer(on){
  $('#drawer').classList.toggle('on', on);
  $('#scrim').classList.toggle('on', on);
}
$('#btnMenu').onclick = ()=> setDrawer(!$('#drawer').classList.contains('on'));
$('#scrim').onclick   = ()=> setDrawer(false);

function go(view, silent){
  if (S.view === 'capture' && view !== 'capture') stopPreview();
  if (view !== S.view) stopAllPlayers();
  S.view = view;
  $$('.view').forEach(v=>v.classList.toggle('on', v.id === 'v-'+view));
  $$('.navitem[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===view));
  $('#barTitle').textContent = TITLES[view] || 'Arcmo';
  setDrawer(false);
  updateBack();
  if (view === 'report' && S.rep && S.rep.repPlayer) resumePlayer(S.rep.repPlayer);
  if (!silent) window.scrollTo(0,0);
}
$$('.navitem[data-go]').forEach(b => b.onclick = ()=>{
  const v = b.dataset.go;
  if (v==='home') renderHome();
  if (v==='manage') renderManage();
  if (v==='analysis') renderAna();
  go(v);
});

function updateBack(){
  const mobile = window.matchMedia('(max-width:899px)').matches;
  let show = false;
  if (['report','detail','progress','capture'].includes(S.view)) show = true;
  else if (mobile && S.view==='home' && S.home.player) show = true;
  else if (mobile && S.view==='analysis' && S.ana.player) show = true;
  else if (mobile && S.view==='manage' && S.manage.team) show = true;
  $('#btnBack').classList.toggle('hide', !show);
}
$('#btnBack').onclick = ()=>{
  if (S.view==='detail'){ go('report'); return; }
  if (S.view==='report'){ renderHome(); go('home'); return; }
  if (S.view==='progress'){ go('capture'); startPreview(); return; }
  if (S.view==='capture'){ if(!confirmLeaveCapture()) return; go('analysis'); return; }
  if (S.view==='home'){ S.home.player=null; renderHome(); return; }
  if (S.view==='analysis'){ S.ana.player=null; renderAna(); return; }
  if (S.view==='manage'){ S.manage.team=null; renderManage(); return; }
};
window.addEventListener('resize', updateBack);

function confirmLeaveCapture(){
  if (S.cap.recording) { toast('녹화를 먼저 중지하세요'); return false; }
  return true;
}
</script>

<script>
/* ═══════════ 팀 선택 시트 ═══════════ */
function pickTeam(cur, cb){
  const rows = S.teams.map(t=>{
    const n = playersOfTeam(t.name).length;
    const on = t.name===cur ? ' style="background:var(--accent-soft)"' : '';
    return '<button class="lrow" data-t="'+esc(t.name)+'"'+on+'>'
      + '<span class="avatar" style="background:'+esc(t.color||teamColor(t.name))+'">'+esc(initial(t.name))+'</span>'
      + '<span class="grow"><span class="nm">'+esc(t.name)+'</span><span class="meta">선수 '+n+'명</span></span>'
      + '</button>';
  }).join('');
  openSheet('<h3>팀 선택</h3><div style="max-height:52dvh;overflow:auto;margin:0 -20px">'
    + (rows || '<div class="empty">등록된 팀이 없습니다.</div>')
    + '</div><div class="acts"><button class="btn" data-close>닫기</button></div>');
  $$('#sheetPanel .lrow').forEach(b => b.onclick = ()=>{ closeSheet(); cb(b.dataset.t); });
}

/* ═══════════ 홈 ═══════════ */
function renderHome(){
  const st = S.home;
  if (!st.team && S.teams.length === 1) st.team = S.teams[0].name;

  $('#homeTeamNm').textContent = st.team || '팀을 선택하세요';
  const av = $('#homeTeamAv');
  av.textContent = st.team ? initial(st.team) : '?';
  av.style.background = st.team ? teamColor(st.team) : 'var(--ink3)';
  $('#homeTeamCnt').textContent = st.team ? (playersOfTeam(st.team).length + '명') : '';

  $('#homePlayers').innerHTML = playerListHTML(st.team, st.q, st.player);
  $$('#homePlayers .lrow').forEach(b => b.onclick = ()=> selectHomePlayer(b.dataset.p));

  $('#homeSplit').classList.toggle('detail', !!st.player);
  renderHomeRight();
  updateBack();
}

function playerListHTML(team, q, selId){
  if (!team) return emptyHTML('팀을 먼저 선택하세요','좌측 위에서 팀을 고르면 선수 목록이 나옵니다.');
  let list = playersOfTeam(team);
  const qq = String(q||'').trim().toLowerCase();
  if (qq) list = list.filter(p => String(p.name).toLowerCase().includes(qq) || String(p.number).includes(qq));
  if (!list.length) return emptyHTML('선수가 없습니다', qq ? '검색어를 지워보세요.' : '팀/선수 관리에서 추가할 수 있습니다.');
  return list.map(p =>
    '<button class="lrow'+(p.id===selId?' on':'')+'" data-p="'+esc(p.id)+'">'
    + '<span class="num">'+esc(p.number)+'</span>'
    + '<span class="grow" style="min-width:0"><span class="nm">'+esc(p.name)+'</span>'
    + '<span class="meta">'+esc(p.position||'N/A')+' · '+esc(lrText(p.lr))+'</span></span>'
    + '<svg class="i" viewBox="0 0 24 24" style="width:16px;color:var(--ink3)"><path d="M9 5l7 7-7 7"/></svg>'
    + '</button>').join('');
}

function emptyHTML(title, sub){
  return '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>'
    + '<div style="font-weight:650;color:var(--ink2)">'+esc(title)+'</div>'
    + (sub?'<div style="margin-top:4px">'+esc(sub)+'</div>':'') + '</div>';
}

async function selectHomePlayer(id){
  S.home.player = id;
  S.home.reports = []; S.home.loading = true;
  renderHome();
  try{
    const r = await api('/api/players/'+encodeURIComponent(id)+'/reports');
    if (S.home.player !== id) return;
    S.home.reports = r.reports || [];
  }catch(e){
    S.home.reports = null;
  }finally{
    S.home.loading = false;
    if (S.home.player === id) renderHomeRight();
  }
}

function renderHomeRight(){
  const host = $('#homeRight');
  const st = S.home;
  if (!st.player){
    host.innerHTML = st.team ? emptyHTML('선수를 선택하세요','왼쪽 목록에서 선수를 고르면 분석 기록이 보입니다.') : featureGridHTML();
    if (!st.team) wireFeatureGrid(host);
    return;
  }
  const p = playerById(st.player);
  if (!p){ host.innerHTML = emptyHTML('선수를 찾을 수 없습니다',''); return; }

  host.innerHTML = playerHeaderHTML(p) + '<div id="repList"></div>';
  $('#hpAnalyze').onclick = ()=> startFlowFor(p);
  const ed = $('#hpEdit'); if (ed) ed.onclick = ()=> editPlayer(p.id);
  renderReportList();
}

function playerHeaderHTML(p){
  return '<div class="phead">'
    + '<span class="avatar big" style="background:'+esc(teamColor(p.team))+'">'+esc(initial(p.name))+'</span>'
    + '<div><h2>'+esc(p.name)+'</h2>'
    + '<div class="sub">'+esc(p.team)+' · '+esc(p.number)+'번 · '+esc(p.position||'N/A')+' · '+esc(lrText(p.lr))+'</div></div>'
    + '<div class="acts">'
    + '<button class="btn sm" id="hpEdit">선수 정보</button>'
    + '<button class="btn primary" id="hpAnalyze">분석하기</button>'
    + '</div></div>';
}

function renderReportList(){
  const host = $('#repList'); if (!host) return;
  const st = S.home;
  if (st.loading){ host.innerHTML = '<div class="empty"><span class="spin" style="color:var(--accent)"></span><div style="margin-top:10px">기록 불러오는 중…</div></div>'; return; }
  if (st.reports === null){ host.innerHTML = '<div class="empty">기록을 불러오지 못했습니다. 서버 연결을 확인하세요.</div>'; return; }
  if (!st.reports.length){
    host.innerHTML = '<div class="empty"><div style="font-weight:650;color:var(--ink2)">분석 기록이 없습니다</div>'
      + '<div style="margin-top:4px">위의 “분석하기”로 첫 촬영을 시작하세요.</div></div>';
    return;
  }
  const rows = st.reports.map(r=>{
    const tags = (r.items||[]).map(t=>'<span class="pill">'+esc(t)+'</span>').join('');
    const stt = r.is_complete ? '<span class="pill ok">완료</span>'
              : (r.has_summary ? '<span class="pill run">중단됨</span>' : '<span class="pill bad">미완</span>');
    const hs = r.head_stability!=null ? r.head_stability.toFixed(1) : '-';
    return '<button class="rrow" data-open="'+esc(r.report_id)+'">'
      + '<span class="d"><b>'+esc(r.date||'-')+'</b><span>'+esc(r.report_id)+'</span></span>'
      + '<span class="tags grow">'+(tags||'<span class="dim">항목 없음</span>')+'</span>'
      + '<span class="sc"><b>'+hs+'</b><span>머리고정</span></span>'
      + '<span class="d" style="min-width:auto">'+stt+'</span>'
      + '<svg class="i go" viewBox="0 0 24 24" style="width:17px"><path d="M9 5l7 7-7 7"/></svg>'
      + '</button>';
  }).join('');
  host.innerHTML = '<div class="pad" style="padding-top:14px"><div class="sect-t">분석 기록 '+st.reports.length+'건</div>'
    + '<div class="card" style="overflow:hidden">'+rows+'</div></div>';
  $$('#repList [data-open]').forEach(b => b.onclick = ()=> openReport(S.home.player, b.dataset.open));
}

function featureGridHTML(){
  const c = (icon,t,s,go,dis)=> '<button class="fcard" '+(dis?'disabled':'data-f="'+go+'"')+'>'
    + '<span class="ic">'+icon+'</span><b>'+t+'</b><span>'+s+'</span></button>';
  return '<div class="fgrid">'
    + c('<svg class="i lg" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 6a3 3 0 0 1 0 6"/></svg>',
        '팀 / 선수 관리','팀과 선수를 추가·수정합니다.','manage')
    + c('<svg class="i lg" viewBox="0 0 24 24"><path d="M4 20L14 6"/><circle cx="17" cy="4" r="2"/><path d="M6 18l-2 2"/></svg>',
        '타격 분석','촬영하고 바로 분석합니다.','analysis')
    + c('<svg class="i lg" viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-6M22 18v-9"/></svg>',
        '데이터 비교','두 리포트를 나란히 봅니다.','',1)
    + c('<svg class="i lg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>',
        '레퍼런스 데이터','기준 데이터와 비교합니다.','',1)
    + '</div>';
}
function wireFeatureGrid(host){
  $$('.fcard[data-f]', host).forEach(b => b.onclick = ()=>{
    const f = b.dataset.f;
    if (f==='manage'){ renderManage(); go('manage'); }
    if (f==='analysis'){ renderAna(); go('analysis'); }
  });
}

$('#homeTeamBtn').onclick = ()=> pickTeam(S.home.team, t=>{ S.home.team=t; S.home.player=null; S.home.q=''; $('#homeSearch').value=''; renderHome(); });
$('#homeSearch').oninput = e => { S.home.q = e.target.value; $('#homePlayers').innerHTML = playerListHTML(S.home.team, S.home.q, S.home.player);
  $$('#homePlayers .lrow').forEach(b => b.onclick = ()=> selectHomePlayer(b.dataset.p)); };
</script>

<script>
/* ═══════════ 팀 / 선수 관리 ═══════════ */
function renderManage(){
  const st = S.manage;
  const host = $('#manageTeams');
  host.innerHTML = S.teams.length ? S.teams.map(t =>
      '<button class="lrow'+(t.name===st.team?' on':'')+'" data-t="'+esc(t.name)+'">'
      + '<span class="avatar" style="background:'+esc(t.color||teamColor(t.name))+'">'+esc(initial(t.name))+'</span>'
      + '<span class="grow"><span class="nm">'+esc(t.name)+'</span><span class="meta">선수 '+playersOfTeam(t.name).length+'명</span></span>'
      + '</button>').join('')
    : emptyHTML('팀이 없습니다','오른쪽 위 “+ 팀 추가”를 누르세요.');
  $$('#manageTeams .lrow').forEach(b => b.onclick = ()=>{ S.manage.team = b.dataset.t; renderManage(); });

  $('#manageSplit').classList.toggle('detail', !!st.team);

  const right = $('#manageRight');
  if (!st.team){ right.innerHTML = emptyHTML('팀을 선택하세요','팀을 고르면 소속 선수를 편집할 수 있습니다.'); updateBack(); return; }

  const list = playersOfTeam(st.team);
  const rows = list.map(p =>
    '<tr><td class="mono">'+esc(p.number)+'</td><td><b>'+esc(p.name)+'</b><div class="dim" style="font-size:11.5px">ID '+esc(p.id)+'</div></td>'
    + '<td>'+esc(p.position||'N/A')+'</td><td>'+esc(lrText(p.lr))+'</td>'
    + '<td class="r"><button class="btn sm" data-edit="'+esc(p.id)+'">수정</button></td></tr>').join('');

  right.innerHTML = '<div class="phead">'

    + '<div><h2>'+esc(st.team)+'</h2><div class="sub">선수 '+list.length+'명</div></div>'
    + '<div class="acts"><button class="btn sm" id="mtEdit">팀 수정</button>'
    + '<button class="btn sm danger" id="mtDel">팀 삭제</button>'
    + '<button class="btn primary" id="mpAdd">+ 선수 추가</button></div></div>'
    + '<div class="pad"><div class="card wrapx"><table class="tbl"><thead><tr>'
    + '<th>배번</th><th>이름</th><th>포지션</th><th>투/타</th><th class="r"></th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="5"><div class="empty">등록된 선수가 없습니다.</div></td></tr>')
    + '</tbody></table></div></div>';

  $('#mtEdit').onclick = ()=> editTeam(st.team);
  $('#mtDel').onclick  = ()=> deleteTeam(st.team);
  $('#mpAdd').onclick  = ()=> editPlayer(null, st.team);
  $$('#manageRight [data-edit]').forEach(b => b.onclick = ()=> editPlayer(b.dataset.edit));

$('#btnAddTeam').onclick = ()=> editTeam(null);

const COLORS = ['#5DADE2','#7A6FF0','#2FA37A','#D98324','#C0567A','#3E8E7E','#8A94A6','#B4553C'];

function editTeam(name){
  const t = S.teams.find(x=>x.name===name) || {name:'',color:COLORS[S.teams.length % COLORS.length]};
  openSheet('<h3>'+(name?'팀 수정':'팀 추가')+'</h3>'
    + '<label class="f">팀 이름</label><input id="tfName" class="inp" value="'+esc(t.name)+'" placeholder="예: 창원시여자야구단">'
    + '<label class="f" style="margin-top:14px">로고 색</label>'
    + '<div class="chips" id="tfColors">'+COLORS.map(c=>'<button class="chip" data-c="'+c+'" style="background:'+c+';color:#fff;border-color:'+c+';width:40px;height:34px;padding:0'+(c===t.color?';outline:3px solid var(--ink);outline-offset:1px':'')+'"></button>').join('')+'</div>'
    + '<div class="err" id="tfErr"></div>'
    + '<div class="acts"><button class="btn" data-close>취소</button><button class="btn primary" id="tfSave">저장</button></div>');
  let color = t.color;
  $$('#tfColors .chip').forEach(b => b.onclick = ()=>{
    color = b.dataset.c;
    $$('#tfColors .chip').forEach(x=>x.style.outline='none');
    b.style.outline = '3px solid var(--ink)'; b.style.outlineOffset='1px';
  });
  $('#tfSave').onclick = async ()=>{
    const nm = $('#tfName').value.trim();
    if (!nm){ $('#tfErr').textContent = '팀 이름을 입력하세요.'; return; }
    try{
      const r = await api('/api/teams', {method:'POST', body:{name:nm, color:color, prev_name:name||''}});
      S.teams = r.teams || S.teams;
      await reloadPlayers();
      if (S.manage.team === name) S.manage.team = nm;
      closeSheet(); renderManage(); toast('저장했습니다');
    }catch(e){ $('#tfErr').textContent = e.message; }
  };
}

async function deleteTeam(name){
  openSheet('<h3>팀 삭제</h3><div class="muted">“'+esc(name)+'”을(를) 삭제합니다. 소속 선수가 있으면 삭제할 수 없습니다.</div>'
    + '<div class="err" id="dtErr"></div>'
    + '<div class="acts"><button class="btn" data-close>취소</button><button class="btn danger" id="dtOk">삭제</button></div>');
  $('#dtOk').onclick = async ()=>{
    try{
      const r = await api('/api/teams/delete', {method:'POST', body:{name:name}});
      S.teams = r.teams || S.teams; S.manage.team = null;
      closeSheet(); renderManage(); toast('삭제했습니다');
    }catch(e){ $('#dtErr').textContent = e.message; }
  };
}

function editPlayer(id, presetTeam){
  const p = playerById(id) || {id:'', number:'', name:'', team:presetTeam||S.teams[0]&&S.teams[0].name||'', position:'N/A', lr:'R/R'};
  const isNew = !id;
  const teamOpts = S.teams.map(t=>'<option value="'+esc(t.name)+'"'+(t.name===p.team?' selected':'')+'>'+esc(t.name)+'</option>').join('');
  const posList = ['N/A','P','C','1B','2B','3B','SS','LF','CF','RF','DH'];
  const posOpts = posList.map(x=>'<option'+(x===p.position?' selected':'')+'>'+x+'</option>').join('');
  const lrList = ['R/R','R/L','L/R','L/L','R/B','L/B'];
  const lrOpts = lrList.map(x=>'<option'+(x===p.lr?' selected':'')+'>'+x+'</option>').join('');

  openSheet('<h3>'+(isNew?'선수 추가':'선수 정보')+'</h3>'
    + '<div class="fields">'
    + '<div><label class="f">선수 ID '+(isNew?'(리포트 폴더 이름이 됩니다)':'')+'</label>'
    + '<input id="pfId" class="inp" value="'+esc(p.id)+'"'+(isNew?'':' disabled')+' placeholder="예: 1043" inputmode="numeric"></div>'
    + '<div class="row" style="gap:10px"><div style="width:96px"><label class="f">배번</label>'
    + '<input id="pfNum" class="inp" value="'+esc(p.number)+'" inputmode="numeric"></div>'
    + '<div class="grow"><label class="f">이름</label><input id="pfName" class="inp" value="'+esc(p.name)+'"></div></div>'
    + '<div><label class="f">팀</label><select id="pfTeam" class="inp">'+teamOpts+'</select></div>'
    + '<div class="row" style="gap:10px"><div class="grow"><label class="f">포지션</label><select id="pfPos" class="inp">'+posOpts+'</select></div>'
    + '<div class="grow"><label class="f">투/타</label><select id="pfLr" class="inp">'+lrOpts+'</select></div></div>'
    + '</div><div class="hintline">투/타의 <b style="color:var(--ink)">뒤쪽 글자</b>가 타격 손입니다. 손 이동경로 분석에 쓰입니다.</div>'
    + '<div class="err" id="pfErr"></div>'
    + '<div class="acts">'+(isNew?'':'<button class="btn danger" id="pfDel">삭제</button>')
    + '<button class="btn" data-close>취소</button><button class="btn primary" id="pfSave">저장</button></div>');

  $('#pfSave').onclick = async ()=>{
    const body = {
      id: $('#pfId').value.trim(),
      number: parseInt($('#pfNum').value,10) || 0,
      name: $('#pfName').value.trim(),
      team: $('#pfTeam').value,
      position: $('#pfPos').value,
      lr: $('#pfLr').value,
    };
    if (!body.id){ $('#pfErr').textContent='선수 ID를 입력하세요.'; return; }
    if (!body.name){ $('#pfErr').textContent='이름을 입력하세요.'; return; }
    if (isNew && playerById(body.id)){ $('#pfErr').textContent='이미 있는 선수 ID입니다.'; return; }
    try{
      await api('/api/players', {method:'POST', body:body});
      await reloadPlayers();
      closeSheet(); renderManage();
      if (S.view==='home') renderHome();
      toast('저장했습니다');
    }catch(e){ $('#pfErr').textContent = e.message; }
  };
  const del = $('#pfDel');
  if (del) del.onclick = async ()=>{
    try{
      await api('/api/players/delete', {method:'POST', body:{id:p.id}});
      await reloadPlayers();
      if (S.home.player===p.id) S.home.player=null;
      closeSheet(); renderManage(); if (S.view==='home') renderHome();
      toast('삭제했습니다');
    }catch(e){ $('#pfErr').textContent = e.message; }
  };
}

async function reloadPlayers(){
  try{ const r = await api('/api/players'); S.players = r.players || []; }catch(e){}
}
</script>

<script>
/* ═══════════ 분석: 선수 + 항목 선택 ═══════════ */
const OPT_META = {
  '손 이동경로':      {ov:'hand_trace',            desc:'스윙 궤적과 히팅포인트', lr:true},
  '머리 고정':        {ov:'head_stability',        desc:'머리 흔들림 점수'},
  '어깨-골반 회전':   {ov:'shoulder_hip_rotation', desc:'상하체 분리·어깨 열림'},
  '무게중심':         {ov:'center_shift',          desc:'임팩트 시 앞뒤 체중'},
};
const OPT_ORDER = ['손 이동경로','머리 고정','어깨-골반 회전','무게중심'];

function startFlowFor(p){
  S.ana.team = p.team; S.ana.player = p.id;
  if (!S.ana.items.size) S.ana.items = new Set(['머리 고정','어깨-골반 회전','무게중심']);
  renderAna(); go('analysis');
}

function renderAna(){
  const st = S.ana;
  if (!st.team && S.teams.length===1) st.team = S.teams[0].name;

$('#anaTeamBtn').onclick = ()=> pickTeam(S.ana.team, t=>{ S.ana.team=t; S.ana.player=null; S.ana.q=''; $('#anaSearch').value=''; renderAna(); });
$('#anaSearch').oninput = e => { S.ana.q = e.target.value; $('#anaPlayers').innerHTML = playerListHTML(S.ana.team, S.ana.q, S.ana.player);
  $$('#anaPlayers .lrow').forEach(b => b.onclick = ()=>{ S.ana.player=b.dataset.p; renderAna(); }); };

/* ═══════════ 촬영 ═══════════ */
function enterCapture(){
  const p = playerById(S.ana.player);
  if (!p) return;
  S.cap.recording = false; S.cap.recorded = false;
  $('#capWho').textContent = p.name + ' · ' + Array.from(S.ana.items).join(', ');
  $('#capTimer').textContent = '0:00';
  $('#capHint').textContent = '녹화 버튼을 누르세요';
  $('#btnAnalyze').disabled = true;
  $('#recBadge').classList.remove('on');
  $('#btnRec').classList.remove('rec');
  go('capture');
  startPreview();
}

function startPreview(){
  const img = $('#preview'), ph = $('#previewPh');
  ph.textContent = '카메라 화면을 불러오는 중…';
  ph.style.display = 'grid';
  img.onload  = ()=>{ ph.style.display='none'; };
  img.onerror = ()=>{ ph.style.display='grid'; ph.textContent = '카메라 화면을 받지 못했습니다. 분석PC의 카메라 연결을 확인하세요.'; };
  img.src = url('/video_feed?ts=' + Date.now());
  S.cap.streaming = true;
}
function stopPreview(){
  const img = $('#preview');
  img.removeAttribute('src'); img.onload = img.onerror = null;
  S.cap.streaming = false;
  clearInterval(S.cap.timer); S.cap.timer = null;
}

$('#btnRec').onclick = async ()=>{
  const btn = $('#btnRec'); btn.disabled = true;
  try{
    if (!S.cap.recording){
      await api('/start', {method:'POST', body:{}, timeout:10000});
      S.cap.recording = true; S.cap.recorded = false; S.cap.t0 = Date.now();
      btn.classList.add('rec'); $('#recBadge').classList.add('on');
      $('#capHint').textContent = '스윙 후 정지를 누르세요';
      $('#btnAnalyze').disabled = true;
      clearInterval(S.cap.timer);
      S.cap.timer = setInterval(()=>{ $('#capTimer').textContent = fmtDur(Date.now()-S.cap.t0); }, 200);
    } else {
      // 응답을 기다리기 전에 먼저 멈춘다.
      // /stop 은 세그먼트 concat -> 트림 -> H.264 변환까지 마치고 돌아오므로
      // await 뒤에서 멈추면 그 시간(수 초)만큼 타이머가 계속 올라간다.
      S.cap.recording = false;
      btn.classList.remove('rec'); $('#recBadge').classList.remove('on');
      clearInterval(S.cap.timer); S.cap.timer = null;
      $('#capHint').textContent = '저장 중…';
      try{
        // 변환 시간은 녹화 길이에 비례한다. nvenc 가 없으면 특히 오래 걸리므로 넉넉히.
        const r = await api('/stop', {method:'POST', body:{}, timeout:180000});
        S.cap.recorded = true;
        $('#btnAnalyze').disabled = false;
        const c = r && r.capture;
        $('#capHint').textContent = c
          ? ('저장 완료 · ' + Number(c.output_duration_sec).toFixed(1) + '초 · ' + c.measured_fps + 'fps')
          : '분석하거나 다시 녹화하세요';
        if (c) $('#capTimer').textContent = fmtDur(Number(c.output_duration_sec) * 1000);
      }catch(e){
        S.cap.recorded = false;
        $('#btnAnalyze').disabled = true;
        $('#capHint').textContent = '저장 실패 — 다시 녹화하세요';
        throw e;
      }
    }
  }catch(e){ toast('녹화 제어 실패: ' + e.message, 3200); }
  finally{ btn.disabled = false; }
};

$('#btnAnalyze').onclick = async ()=>{
  const p = playerById(S.ana.player);
  if (!p) return;
  const bs = batSide(p.lr);
  const items = Array.from(S.ana.items);
  if (items.includes('손 이동경로') && !bs){ toast('손 이동경로 분석에는 타격 손(L/R)이 필요합니다', 3200); return; }

  const flags = {};
  OPT_ORDER.forEach(k => { flags[k] = S.ana.items.has(k); });
  const options = Object.assign({}, flags);
  if (bs) options.lr = bs;

  $('#btnAnalyze').disabled = true;
  try{
    const r = await api('/call_model', {method:'POST', timeout:60000, body:{
      player_id: p.id,
      options: options,
      analysis_options: flags,
      video_path: 'temp/original_video.mp4',
    }});
    if (!r || !r.report_id) throw new Error('서버가 report_id를 주지 않았습니다.');
    stopPreview();
    startJob(p, r.report_id, items);
  }catch(e){
    $('#btnAnalyze').disabled = false;
    toast('분석 요청 실패: ' + e.message, 3600);
  }
};

/* ═══════════ 진행 상황 ═══════════ */
const STEP_LABEL = {
  preprocess:'영상 전처리', motion_capture:'동작 추출 (자세 인식)',
  hand_trace:'손 이동경로', head_stability:'머리 고정',
  center_shift:'무게중심', shoulder_hip_rotation:'어깨-골반 회전',
};

function startJob(player, reportId, items){
  S.job = {pid:player.id, rid:reportId, polling:true, stop:false};
  $('#progTitle').textContent = player.name + ' 분석 중';
  $('#progSub').textContent = reportId + ' · ' + items.join(', ');
  $('#progErr').textContent = '';
  $('#progOpen').disabled = true;
  const want = ['preprocess','motion_capture'].concat(items.map(k=>OPT_META[k].ov));
  renderSteps({}, want, false);
  go('progress');
  pollJob(want);
}

function renderSteps(status, want, done){
  const steps = (status && status.steps) || {};
  const errs  = (status && status.errors) || {};
  let okCount = 0, firstPending = true;
  const html = want.map(k=>{
    const st = steps[k];
    let cls = '', mk = '<span style="width:7px;height:7px;border-radius:50%;background:currentColor"></span>', ms = '대기';
    if (st && st.ok === true){ cls='ok'; okCount++; ms='완료';
      mk = '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M5 12l5 5L19 7"/></svg>'; }
    else if (st && st.ok === false){ cls='bad'; ms = errs[k] || '실패';
      mk = '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:3"><path d="M6 6l12 12M18 6L6 18"/></svg>'; }
    else if (!done && firstPending){ cls='run'; ms='진행 중'; mk='<span class="spin"></span>'; firstPending=false; }
    return '<div class="step '+cls+'"><span class="mk">'+mk+'</span>'
      + '<span class="grow"><span class="nm">'+esc(STEP_LABEL[k]||k)+'</span></span>'
      + '<span class="ms">'+esc(ms)+'</span></div>';
  }).join('');
  $('#progSteps').innerHTML = html;
  $('#progBar').style.width = Math.round(okCount/Math.max(1,want.length)*100) + '%';
}

async function pollJob(want){
  const {pid, rid} = S.job;
  const started = Date.now();
  while (S.job.polling && !S.job.stop){
    let status = null;
    try{ status = await api('/reports/'+encodeURIComponent(pid)+'/'+encodeURIComponent(rid)+'/ready?wait=5', {timeout:12000}); }
    catch(e){ if (e.status !== 404) { /* 잠깐 끊길 수 있음 */ } }
    if (S.job.stop) return;
    if (status){
      renderSteps(status, want, !!status.is_complete);
      if (status.is_complete){
        S.job.polling = false;
        $('#progTitle').textContent = '분석 완료';
        $('#progOpen').disabled = false;
        const errN = Object.keys(status.errors||{}).length;
        if (errN) $('#progErr').textContent = errN + '개 항목이 실패했습니다. 아래에서 확인하세요.';
        if (S.view==='progress') openReport(pid, rid);
        return;
      }
    }
    if (Date.now() - started > 15*60*1000){
      S.job.polling = false;
      $('#progErr').textContent = '분석이 15분을 넘겼습니다. 분석PC 콘솔을 확인해주세요.';
      $('#progOpen').disabled = false;
      return;
    }
    await sleep(900);
  }
}

$('#progBack').onclick = ()=>{ S.job.stop = true; go('capture'); startPreview(); };
$('#progOpen').onclick = ()=> openReport(S.job.pid, S.job.rid);
</script>

<script>
/* ═══════════ 차트 ═══════════ */
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawChart(host, spec){
  const cv = $('canvas', host);
  const r = host.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  const W = Math.max(120, r.width), H = Math.max(90, r.height);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);

  const line = cssv('--line'), ink3 = cssv('--ink3'), ink2 = cssv('--ink2');
  const padL = 44, padR = 12, padT = 12, padB = 26;
  const xs = spec.x || [];
  const sets = (spec.series||[]).filter(s => s.data && s.data.length);
  if (!xs.length || !sets.length){
    g.fillStyle = ink3; g.font = '13px system-ui'; g.textAlign='center';
    g.fillText('표시할 데이터가 없습니다', W/2, H/2);
    return null;
  }

  let lo = Infinity, hi = -Infinity;
  sets.forEach(s => s.data.forEach(v => { if (v!=null && Number.isFinite(v)){ if(v<lo)lo=v; if(v>hi)hi=v; } }));
  if (!Number.isFinite(lo)){ lo=0; hi=1; }
  if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi-lo)*0.14; lo -= pad; hi += pad;
  if (spec.zeroFloor && lo > 0) lo = 0;

  const x0 = xs[0], x1 = xs[xs.length-1] || (x0+1);
  const px = v => padL + (v - x0) / Math.max(1e-6, (x1-x0)) * (W-padL-padR);
  const py = v => padT + (hi - v) / (hi-lo) * (H-padT-padB);

  // 그리드
  g.strokeStyle = line; g.lineWidth = 1; g.fillStyle = ink3;
  g.font = '11px system-ui'; g.textAlign = 'right'; g.textBaseline = 'middle';
  const ticks = 4;
  for (let i=0;i<=ticks;i++){
    const v = lo + (hi-lo)*i/ticks, y = Math.round(py(v))+0.5;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(W-padR, y); g.stroke();
    g.fillText(spec.fmtY ? spec.fmtY(v) : v.toFixed(0), padL-7, y);
  }
  // x 라벨
  g.textAlign='center'; g.textBaseline='top';
  for (let i=0;i<=3;i++){
    const v = x0 + (x1-x0)*i/3;
    g.fillText(String(Math.round(v)), px(v), H-padB+7);
  }

  // 마커
  if (spec.marker != null && spec.marker >= x0 && spec.marker <= x1){
    const mx = Math.round(px(spec.marker))+0.5;
    g.save(); g.setLineDash([4,4]); g.strokeStyle = ink2; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(mx, padT); g.lineTo(mx, H-padB); g.stroke(); g.restore();
    g.fillStyle = ink2; g.font='700 10.5px system-ui'; g.textAlign = (mx > W*0.7)?'right':'left';
    g.fillText(spec.markerLabel || '임팩트', mx + (mx>W*0.7?-5:5), padT+1);
  }

  // 선
  sets.forEach(s=>{
    g.strokeStyle = s.color; g.lineWidth = 2; g.lineJoin='round'; g.lineCap='round';
    g.beginPath(); let pen = false;
    for (let i=0;i<xs.length;i++){
      const v = s.data[i];
      if (v==null || !Number.isFinite(v)){ pen = false; continue; }
      const X = px(xs[i]), Y = py(v);
      if (!pen){ g.moveTo(X,Y); pen = true; } else g.lineTo(X,Y);
    }
    g.stroke();
  });

  // 커서 — 영상의 현재 프레임(또는 손가락 위치)
  const ci = spec.cursorIdx;
  if (ci != null && ci >= 0 && ci < xs.length){
    const X = px(xs[ci]);
    g.strokeStyle = cssv('--ink3'); g.lineWidth = 1;
    g.beginPath(); g.moveTo(X+0.5, padT); g.lineTo(X+0.5, H-padB); g.stroke();
    sets.forEach(s=>{
      const v = s.data[ci];
      if (v==null || !Number.isFinite(v)) return;
      const Y = py(v);
      g.fillStyle = cssv('--surface'); g.beginPath(); g.arc(X,Y,5,0,7); g.fill();
      g.fillStyle = s.color; g.beginPath(); g.arc(X,Y,3.4,0,7); g.fill();
    });
  }

  return {px, py, x0, x1, padL, padR, padT, padB, W, H, lo, hi};
}

function wireChart(host, spec){
  let geo = drawChart(host, spec);
  const tip = $('.tip', host);
  if (!geo || !tip) return;

  function idxAt(clientX){
    const r = host.getBoundingClientRect();
    const t = (clientX - r.left - geo.padL) / Math.max(1,(geo.W - geo.padL - geo.padR));
    const xv = geo.x0 + t*(geo.x1-geo.x0);
    let bi = 0, bd = Infinity;
    for (let i=0;i<spec.x.length;i++){ const d = Math.abs(spec.x[i]-xv); if (d<bd){ bd=d; bi=i; } }
    return bi;
  }
  function showTip(){
    const i = spec.cursorIdx;
    if (i == null || !geo){ tip.classList.remove('on'); return; }
    tip.innerHTML = '<b>프레임 '+spec.x[i]+'</b>' + spec.series.map(s=>{
      const v = s.data[i];
      return '<div class="l"><span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'
        + '<b style="color:var(--ink);font-weight:700;display:inline">'
        + (v==null||!Number.isFinite(v) ? '-' : (spec.fmtV?spec.fmtV(v):v.toFixed(1))) + '</b></div>';
    }).join('');
    tip.classList.add('on');
    const X = geo.px(spec.x[i]), tw = tip.offsetWidth || 130;
    tip.style.left = Math.max(4, Math.min(geo.W - tw - 4, X - tw/2)) + 'px';
    tip.style.top  = '8px';
  }
  function paint(){ geo = drawChart(host, spec); showTip(); }
  function moveTo(i){ if (spec.cursorIdx === i) return; spec.cursorIdx = i; paint(); }

  /* 영상 쪽에서 부릅니다 — 프레임 번호(1부터)를 받아 커서를 옮깁니다. */
  host._syncFrame = function(frameNo){
    let bi = 0, bd = Infinity;
    for (let i=0;i<spec.x.length;i++){ const d = Math.abs(spec.x[i]-frameNo); if (d<bd){ bd=d; bi=i; } }
    moveTo(bi);
  };
  host._redraw = paint;
  /* 그래프를 누르면 영상을 그 프레임으로 — openDetail 에서 채워 넣습니다. */
  host._onPick = null;
  function pick(){ if (host._onPick && spec.cursorIdx!=null) host._onPick(spec.x[spec.cursorIdx]); }

  host.onpointermove = e => { if (e.pointerType==='mouse'){ moveTo(idxAt(e.clientX)); } };
  host.onclick       = e => { moveTo(idxAt(e.clientX)); pick(); };
  host.ontouchstart  = e => { moveTo(idxAt(e.touches[0].clientX)); };
  host.ontouchmove   = e => { e.preventDefault(); moveTo(idxAt(e.touches[0].clientX)); };
  host.ontouchend    = () => { pick(); };

  if (!host._ro){
    host._ro = new ResizeObserver(()=>{ paint(); });
    host._ro.observe(host);
  }
}

function chartHTML(id){
  return '<div class="chartbox" id="'+id+'"><canvas></canvas><div class="tip"></div></div>';
}
</script>

<script>
/* ═══════════ 리포트 ═══════════ */
const OV_LABEL = { skeleton:'스켈레톤', hand_trace:'손 이동경로', head_stability:'머리 고정',
                   center_shift:'무게중심', shoulder_hip_rotation:'어깨-골반 회전' };

async function openReport(pid, rid){
  stopAllPlayers();
  S.rep = {pid, rid, player: playerById(pid), summary:null, series:null, pose:null, avail:new Set(), sel:new Set()};
  go('report');
  $('#reportRoot').innerHTML = '<div class="empty"><span class="spin" style="color:var(--accent)"></span>'
    + '<div style="margin-top:10px">리포트 불러오는 중…</div></div>';
  try{
    const sm = await api('/reports/'+encodeURIComponent(pid)+'/'+encodeURIComponent(rid)+'/summary?wait=20', {timeout:26000});
    S.rep.summary = sm || {};
  }catch(e){
    $('#reportRoot').innerHTML = '<div class="empty">리포트를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>';
    return;
  }
  try{ S.rep.series = await api('/reports/'+encodeURIComponent(pid)+'/'+encodeURIComponent(rid)+'/series', {timeout:20000}); }
  catch(e){ S.rep.series = null; }

  // 겹쳐보기용 좌표. 있으면 canvas 로 그리고(합성 대기 0), 없으면 예전처럼 합성 MP4 를 씁니다.
  try{
    const pose = await api('/api/pose?player_id='+encodeURIComponent(pid)+'&report_id='+encodeURIComponent(rid), {timeout:20000});
    S.rep.pose = (pose && pose.meta && pose.overlays) ? pose : null;
  }catch(e){ S.rep.pose = null; }

  const ov = (S.rep.summary && S.rep.summary.overlays) || {};
  Object.keys(OV_LABEL).forEach(k => { if (ov[k]) S.rep.avail.add(k); });
  ['shoulder_hip_rotation','center_shift','skeleton'].forEach(k => { if (S.rep.avail.has(k)) S.rep.sel.add(k); });
  if (!S.rep.sel.size && S.rep.avail.size) S.rep.sel.add(Array.from(S.rep.avail)[0]);

  renderReport();
}

function renderReport(){
  const R = S.rep, sm = R.summary || {};
  const p = R.player || {name:R.pid, team:'', number:'', position:'', lr:''};
  const hs = num(sm.head_stability), ws = num(sm.weight_shift_range);
  const sep = num(sm.separation_deg), stride = num(sm.stride_cm);
  const rows = [
    ['테이크백', num(sm.shoulder_takeback_deg), num(sm.pelvis_takeback_deg)],
    ['팔로우스윙', num(sm.shoulder_follow_deg),  num(sm.pelvis_follow_deg)],
  ];
  const d = v => v==null ? '-' : v.toFixed(1);

  const chips = Object.keys(OV_LABEL).map(k=>{
    const has = R.avail.has(k);
