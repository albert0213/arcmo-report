/* 소리로 찾은 임팩트 안내 — 있을 때만. 프레임은 사람이 읽는 1-based 로 표시한다. */
function impactNoteHTML(){
  const f = repImpactFrame();
  if (f == null) return '';
  const c = repImpactConf();
  const conf = (c != null) ? '  · 신뢰도 ' + (c*100).toFixed(0) + '%' : '';
  return '<div style="margin-top:6px;color:var(--accent);font-weight:600">'
    + '⚡ 소리로 찾은 임팩트: 프레임 ' + (f+1) + conf + '</div>';
}
function headNote(sm){
  const t = sm.head_score_thresholds;
  if (Array.isArray(t) && t.length===2) return '척도 ' + t[0] + '–' + t[1] + 'px';
  return '';
}
function hasSeries(key){
  const se = S.rep.series;
  if (!se || !se.series) return false;
  const n = se.series[key];
  if (!n) return false;
  const arr = n.frame || [];
  return arr.length > 1;
}

/* ═══════════ 영상 플레이어 (겹쳐보기 canvas + 프레임 이동) ═══════════
   리포트 화면과 지표 상세 화면이 같은 코드를 씁니다.
   오버레이 MP4 5개를 ffmpeg 으로 합성하던 것을, 좌표(/api/pose)만 받아
   브라우저에서 직접 그리는 것으로 바꿨습니다. 색·굵기·반지름은
   analytics_model/data_analytics/{skeleton,hand_trace,head_stability,
   center_shift,shoulder_hip_rotation}.py 의 렌더 코드와 같은 값입니다.
   (파이썬은 BGR, 여기는 RGB — 색은 뒤집어 옮겼습니다) */
const OVL_ORDER = ['skeleton','center_shift','shoulder_hip_rotation','hand_trace','head_stability'];
const TAU = Math.PI * 2;
const PLAYERS = [];

function newPlayer(prefix){
  return { p:prefix, vid:prefix+'Video', cid:prefix+'Canvas', ovl:prefix+'Ovl',
           box:prefix+'Box', step:prefix+'Step', num:prefix+'Num', rng:prefix+'Range',
           sel:new Set(), onFrame:null,
           _on:false, _raf:0, _tick:0, _ro:null, _key:null, _mt:null, _i:-1 };
}
function pEl(P, k){ return document.getElementById(P[k]); }

function repPlayerFor(R){
  if (R.repPlayer) stopPlayer(R.repPlayer);      // 다시 그릴 때 옛 루프를 남기지 않습니다
  R.repPlayer = newPlayer('rep');
  R.repPlayer.sel = R.sel;               // 칩 선택과 같은 Set 을 공유합니다
  return R.repPlayer;
}

function playerHTML(P){
  const impF = repImpactFrame(), n = repFrameCount();
  const impBtn = (impF != null)
    ? '<button class="btn sm imp" data-imp="1" title="소리로 찾은 임팩트로 이동">⚡ 임팩트</button>' : '';
  const impMark = (impF != null && n > 1)
    ? '<span class="fimp" style="left:'+(impF/(n-1)*100).toFixed(2)+'%"></span>' : '';
  return '<div class="vidbox" style="margin-top:12px" id="'+P.box+'">'
    + '<video id="'+P.vid+'" controls playsinline preload="auto"></video>'
    + '<canvas id="'+P.cid+'"></canvas>'
    + '<div class="ovl" id="'+P.ovl+'">영상 준비 중…</div></div>'
    + '<div class="fstep" id="'+P.step+'">'
      + '<button class="btn sm" data-d="-5" title="5프레임 뒤로">◀◀ 5</button>'
      + '<button class="btn sm" data-d="-1" title="1프레임 뒤로">◀ 1</button>'
      + '<span class="fnum" id="'+P.num+'">-</span>'
      + '<button class="btn sm" data-d="1" title="1프레임 앞으로">1 ▶</button>'
      + '<button class="btn sm" data-d="5" title="5프레임 앞으로">5 ▶▶</button>'
      + impBtn
    + '</div>'
    + '<div class="fslide">'+impMark+'<input type="range" id="'+P.rng+'" min="0" max="0" value="0" step="1" aria-label="프레임 선택"></div>';
}

/* fps·프레임 수 — pose 가 있으면 거기서, 없으면 series.json 의 meta 에서 */
function repFps(){
  const R = S.rep;
  if (R.pose && R.pose.meta && R.pose.meta.fps) return R.pose.meta.fps;
  const m = R.series && R.series.meta;
  return (m && m.fps) || 30;
}
function repFrameCount(){
  const R = S.rep;
  if (R.pose && R.pose.meta && R.pose.meta.n_frames) return R.pose.meta.n_frames;
  const se = R.series && R.series.series;
  if (se) for (const k in se){ const f = se[k] && se[k].frame; if (f && f.length) return f.length; }
  return 0;
}
/* 소리로 찾은 임팩트 프레임(0-based). 신규 촬영분에만 있고, 기존 영상엔 null 이다.
   영상은 이 값을 그대로 쓰고, 차트 x 는 1-based 이므로 +1 해서 쓴다. */
function repImpactFrame(){
  const sm = S.rep && S.rep.summary;
  const f = sm && sm.impact_audio_frame;
  if (f == null || !Number.isFinite(Number(f))) return null;
  return Math.max(0, Math.round(Number(f)));
}
function repImpactConf(){
  const sm = S.rep && S.rep.summary;
  const c = sm && sm.impact_audio_confidence;
  return (c == null || !Number.isFinite(Number(c))) ? null : Number(c);
}

function ovlGeom(P){
  const c = pEl(P,'cid'), pose = S.rep && S.rep.pose;
  if (!c || !pose) return null;
  const box = c.parentElement;
  const bw = box.clientWidth, bh = box.clientHeight;
  if (!bw || !bh) return null;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.round(bw*dpr), ch = Math.round(bh*dpr);
  if (c.width !== cw || c.height !== ch){ c.width = cw; c.height = ch; }
  const W = pose.meta.width, H = pose.meta.height;
  if (!W || !H) return null;
  const s = Math.min(bw/W, bh/H) * dpr;      // video 의 object-fit:contain 과 같은 배율
  return { ctx:c.getContext('2d'), s:s, ox:(cw - W*s)/2, oy:(ch - H*s)/2, cw:cw, ch:ch, W:W, H:H };
}

function ovlFrameIndex(P){
  const v = pEl(P,'vid');
  const fps = repFps(), n = repFrameCount() || 1;
  /* requestVideoFrameCallback 이 알려준 '지금 화면에 나온 프레임의 시각'을 우선 씁니다.
     currentTime 은 콜백 사이에 앞서 나가서, 150fps 영상에서 몇 프레임 어긋납니다. */
  const t = (P._mt != null) ? P._mt : ((v && v.currentTime) || 0);
  P._mt = null;                                // 한 번 쓰고 버립니다
  let i = Math.floor(t * fps);
  if (!isFinite(i) || i < 0) i = 0;
  return Math.min(i, n - 1);
}

/* ── 프레임 단위 이동 ── */
function seekFrame(P, i){
  const v = pEl(P,'vid'); if (!v) return;
  const n = repFrameCount() || 1, fps = repFps();
  i = Math.max(0, Math.min(n - 1, i));
  try{ v.pause(); }catch(e){}
  P._mt = null;
  v.currentTime = (i + 0.5) / fps;             // 프레임 한가운데로 — 경계에서 밀리지 않게
}
function stepFrame(P, d){ seekFrame(P, (P._i < 0 ? 0 : P._i) + d); }

function updateFrameNum(P){
  const n = repFrameCount(), fps = repFps();
  const el = pEl(P,'num');
  if (el){
    const sec = fps ? ((P._i + 0.5) / fps) : null;
    el.innerHTML = '프레임 ' + (P._i + 1) + (n ? ' / ' + n : '')
      + (sec != null ? '<small>  ·  ' + sec.toFixed(3) + '초</small>' : '');
  }
  const rng = pEl(P,'rng');
  if (rng){
    if (n && String(rng.max) !== String(n-1)) rng.max = String(n - 1);
    if (String(rng.value) !== String(P._i)) rng.value = String(Math.max(0, P._i));
  }
}

function wirePlayer(P){
  const host = pEl(P,'step');
  if (host) host.querySelectorAll('button[data-d]').forEach(b=>{
    b.onclick = ()=> stepFrame(P, parseInt(b.dataset.d, 10));
  });
  const impBtn = host && host.querySelector('button[data-imp]');
  if (impBtn) impBtn.onclick = ()=>{ const f = repImpactFrame(); if (f != null) seekFrame(P, f); };
  const rng = pEl(P,'rng');
  if (rng){
    const n = repFrameCount();
    if (n) rng.max = String(n - 1);
    rng.oninput = function(){ seekFrame(P, parseInt(rng.value, 10) || 0); };
  }
}

/* ── 그리기 ── */
function _X(g,p){ return g.ox + p[0]*g.s; }
function _Y(g,p){ return g.oy + p[1]*g.s; }
function _line(ctx,g,a,b,color,w){
  ctx.strokeStyle = color; ctx.lineWidth = w*g.s;
  ctx.beginPath(); ctx.moveTo(_X(g,a),_Y(g,a)); ctx.lineTo(_X(g,b),_Y(g,b)); ctx.stroke();
}
function _poly(ctx,g,pts,color,w){
  if (!pts || pts.length < 2) return;
  ctx.strokeStyle = color; ctx.lineWidth = w*g.s;
  ctx.beginPath(); ctx.moveTo(_X(g,pts[0]),_Y(g,pts[0]));
  for (let i=1;i<pts.length;i++) ctx.lineTo(_X(g,pts[i]),_Y(g,pts[i]));
  ctx.stroke();
}
function _dot(ctx,g,p,color,r){
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(_X(g,p),_Y(g,p),r*g.s,0,TAU); ctx.fill();
}

const OVL_DRAW = {
  skeleton: function(ctx,g,d,i){
    const Q = d.pts[i]; if (!Q) return;
    d.connections.forEach(function(c){
      const a = Q[c[0]], b = Q[c[1]];
      if (a && b) _line(ctx,g,a,b,'#00ff00',2);
    });
    Q.forEach(function(p){ if (p) _dot(ctx,g,p,'#00ff00',5); });
  },

  hand_trace: function(ctx,g,d,i,meta){
    const sk = meta.skip_frames;
    if (i + 1 <= sk) return;
    _poly(ctx, g, d.pts.slice(sk, i+1).filter(Boolean), '#ff0000', 3);
  },

  head_stability: function(ctx,g,d,i,meta){
    const sk = meta.skip_frames;
    if (i + 1 > sk){
      d.pts.slice(sk, i+1).forEach(function(p){ if (p) _dot(ctx,g,p,'#ffc800',5); });
    }
    if (d.anchor){
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2*g.s;
      ctx.beginPath(); ctx.arc(_X(g,d.anchor),_Y(g,d.anchor),30*g.s,0,TAU); ctx.stroke();
    }
  },

  center_shift: function(ctx,g,d,i,meta){
    const sk = meta.skip_frames;
    if (i > sk){
      if (d.x_ref != null){
        const x = g.ox + d.x_ref*g.s;
        ctx.strokeStyle = '#808080'; ctx.lineWidth = 2*g.s;
        ctx.beginPath(); ctx.moveTo(x, g.oy); ctx.lineTo(x, g.oy + g.H*g.s); ctx.stroke();
      }
      _poly(ctx, g, d.body.slice(sk,i).filter(Boolean), '#00ff00', 3);
      _poly(ctx, g, d.hip.slice(sk,i).filter(Boolean),  '#00ff00', 3);
    }
    const b = d.body[i], h = d.hip[i];
    if (b && h){
      _line(ctx,g,b,h,'#ff0000',2);
      _dot(ctx,g,b,'#00ff00',5);
      _dot(ctx,g,h,'#00ff00',5);
    }
  },

  shoulder_hip_rotation: function(ctx,g,d,i){
    const ls = d.ls[i], rs = d.rs[i], lh = d.lh[i], rh = d.rh[i];
    const pts = [];
    if (ls && rs){ _line(ctx,g,ls,rs,'#ff0000',4); pts.push(ls,rs); }
    if (lh && rh){ _line(ctx,g,lh,rh,'#0000ff',4); pts.push(lh,rh); }
    if (ls && rs && lh && rh){
      _line(ctx, g, [(ls[0]+rs[0])/2,(ls[1]+rs[1])/2], [(lh[0]+rh[0])/2,(lh[1]+rh[1])/2], '#a0a0a0', 2);
    }
    pts.forEach(function(p){ _dot(ctx,g,p,'#e6e6e6',4); });
  }
};

function drawOverlays(P, force){
  const R = S.rep;
  if (!R || !P) return;
  const i = ovlFrameIndex(P);
  if (i !== P._i){                       // 프레임이 바뀐 순간에만 알립니다 (그래프 동기화)
    P._i = i;
    updateFrameNum(P);
    if (P.onFrame) P.onFrame(i);
  }
  if (!R.pose) return;                   // 옛 리포트 — 겹쳐보기는 합성 MP4 에 이미 들어 있습니다
  const g = ovlGeom(P); if (!g) return;
  const key = i + '|' + Array.from(P.sel).sort().join(',') + '|' + g.cw + 'x' + g.ch;
  if (!force && key === P._key) return;  // 같은 프레임이면 다시 그리지 않습니다
  P._key = key;

  const ctx = g.ctx;
  ctx.clearRect(0, 0, g.cw, g.ch);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  OVL_ORDER.forEach(function(k){
    const d = R.pose.overlays[k];
    if (d && P.sel.has(k) && OVL_DRAW[k]) OVL_DRAW[k](ctx, g, d, i, R.pose.meta);
  });
}

/* ── 루프 ── */
function startPlayer(P){
  if (!P || P._on) return;
  const v = pEl(P,'vid'); if (!v) return;
  P._on = true;
  if (PLAYERS.indexOf(P) < 0) PLAYERS.push(P);
  if (v.requestVideoFrameCallback){
    const step = function(now, meta){
      if (!P._on) return;
      P._mt = (meta && meta.mediaTime != null) ? meta.mediaTime : null;
      drawOverlays(P);
      v.requestVideoFrameCallback(step);
    };
    v.requestVideoFrameCallback(step);
    P._tick = setInterval(function(){ if (P._on) drawOverlays(P); }, 250);   // 일시정지·시크 보정
  } else {
    const step = function(){ if (!P._on) return; drawOverlays(P); P._raf = requestAnimationFrame(step); };
    P._raf = requestAnimationFrame(step);
  }
}

function stopPlayer(P){
  if (!P) return;
  P._on = false;
  if (P._raf){ cancelAnimationFrame(P._raf); P._raf = 0; }
  if (P._tick){ clearInterval(P._tick); P._tick = 0; }
  if (P._ro){ try{ P._ro.disconnect(); }catch(e){} P._ro = null; }
  P._key = null; P._mt = null;
  const k = PLAYERS.indexOf(P); if (k >= 0) PLAYERS.splice(k, 1);
}

function stopAllPlayers(){ PLAYERS.slice().forEach(stopPlayer); }

function observePlayer(P){
  if (!window.ResizeObserver || P._ro) return;
  const box = pEl(P,'box'); if (!box) return;
  P._ro = new ResizeObserver(function(){ drawOverlays(P, true); });
  P._ro.observe(box);
}

function resumePlayer(P){
  const v = P && pEl(P,'vid');
  if (!v || !v.getAttribute('src')) return;
  wirePlayer(P); observePlayer(P);
  drawOverlays(P, true);
  startPlayer(P);
}

/* ── 영상 불러오기 ── */
function loadPlayer(P){
  const R = S.rep;
  const v = pEl(P,'vid'), ovl = pEl(P,'ovl');
  if (!v) return;
  stopPlayer(P);
  P._i = -1;
  wirePlayer(P);
  updateFrameNum(P);

  v.onloadeddata = function(){ ovl.style.display = 'none'; drawOverlays(P, true); startPlayer(P); };
  v.onseeked = function(){ drawOverlays(P, true); };

  if (R.pose){
    /* canvas 방식 — 원본 MP4 를 그대로 받고(재인코딩 0), 겹쳐보기는 브라우저가 그립니다. */
    ovl.style.display = 'grid';
    ovl.textContent = '영상 불러오는 중…';
    v.onerror = function(){
      ovl.style.display = 'grid';
      ovl.innerHTML = '<div>영상을 재생하지 못했습니다.<br><span style="font-size:12.5px">합성 방식으로 다시 시도할 수 있습니다.</span>'
        + '<div style="margin-top:12px"><button class="btn sm" id="vidRetry">다시 시도</button></div></div>';
      const rb = document.getElementById('vidRetry');
      if (rb) rb.onclick = function(){ R.pose = null; renderReport(); };
    };
    v.src = url('/api/report_video?player_id='+encodeURIComponent(R.pid)
          + '&report_id='+encodeURIComponent(R.rid));
    v.load();
    observePlayer(P);
    return;
  }

  /* 예전 방식 — 오버레이 MP4 를 ffmpeg 으로 합성해서 받습니다 (첫 재생 때 대기). */
  const keys = Array.from(P.sel).sort().join(',');
  ovl.style.display = 'grid';
  ovl.textContent = keys ? '영상 합성 중… 처음 한 번은 몇 초 걸립니다' : '영상 불러오는 중…';
  v.onerror = function(){
    ovl.style.display='grid';
    ovl.innerHTML = '<div>영상을 재생하지 못했습니다.<br><span style="font-size:12.5px">겹쳐보기 조합을 바꾸거나 잠시 후 다시 시도해 보세요.</span>'
      + '<div style="margin-top:12px"><button class="btn sm" id="vidRetry">다시 시도</button></div></div>';
    const rb = document.getElementById('vidRetry');
    if (rb) rb.onclick = function(){ loadPlayer(P); };
  };
  v.src = url('/api/overlay_video?player_id='+encodeURIComponent(R.pid)
        + '&report_id='+encodeURIComponent(R.rid) + '&keys=' + encodeURIComponent(keys));
  v.load();
}

function loadReportVideo(){ loadPlayer(S.rep.repPlayer); }

/* ═══════════ 지표 상세 ═══════════ */
/* 2026-09-04: 차트 세로 마커(markerFrame)를 제거했습니다.
   임팩트/열림 프레임은 "타격 손목이 몸통 중심을 넘는 프레임"이라는 프록시였고
   실제 임팩트가 아니어서, 그 자리에 선을 긋는 것이 오히려 오해를 만들었습니다.
   지금은 전 구간을 그대로 보여주고, 시점 판단은 사용자가 영상을 보며 합니다. */

/* 무게중심 — 그 프레임의 좌우 비율을 막대로. 왼쪽(빨강)이 오른발, 오른쪽(파랑)이 왼발입니다
   (metrics 에서 오른발목 x < 몸통중심 x < 왼발목 x 이라 화면 배치와 같습니다). */
function updateWeightBar(cs, i){
  const A = $('#csA'), B = $('#csB'), pill = $('#csPill');
  if (!A || !B || !pill) return;
  const a = cs.right[i], b = cs.left[i];          // a = 오른발, b = 왼발
  const legA = $('#csLegA'), legB = $('#csLegB');
  const tagR = cs.isR ? '뒷발' : '앞발';           // 우타면 오른발이 뒷발
  const tagL = cs.isR ? '앞발' : '뒷발';

  if (a == null || b == null || !Number.isFinite(a) || !Number.isFinite(b) || (a + b) <= 0){
    A.style.width = '0%'; B.style.width = '0%';
    pill.textContent = '측정 안 됨'; pill.style.left = '50%';
    if (legA) legA.innerHTML = '오른발 <span class="sub">'+tagR+'</span> <em>-</em>';
    if (legB) legB.innerHTML = '<em>-</em> <span class="sub">'+tagL+'</span> 왼발';
    return;
  }
  const pa = a / (a + b) * 100;
  A.style.width = pa + '%';
  B.style.width = (100 - pa) + '%';
  pill.textContent = a.toFixed(1) + ' : ' + b.toFixed(1);
  pill.style.left = Math.max(14, Math.min(86, pa)) + '%';
  if (legA) legA.innerHTML = '오른발 <span class="sub">'+tagR+'</span> <em>'+a.toFixed(1)+'</em>';
  if (legB) legB.innerHTML = '<em>'+b.toFixed(1)+'</em> <span class="sub">'+tagL+'</span> 왼발';
}

/* 상세 화면마다 영상 위에 함께 보여줄 오버레이 */
const DETAIL_OV = { rot:'shoulder_hip_rotation', cs:'center_shift',
                    head:'head_stability', hand:'hand_trace' };

function openDetail(which){
  const R = S.rep, sm = R.summary||{}, se = R.series;
  const S1 = cssv('--s1'), S2 = cssv('--s2'), AC = cssv('--accent');
  let title='', body='', charts=[], csBar=null, csTable=null;

  if (which === 'rot'){
    const n = (se && se.series && se.series.shoulder_hip_rotation) || {};
    const x = n.frame || [];
    charts.push({id:'c1', x:x,
      fmtY:v=>v.toFixed(0)+'°', fmtV:v=>v.toFixed(1)+'°',
      series:[{name:'어깨', color:S1, data:n.shoulder_deg||[]}, {name:'골반', color:S2, data:n.hip_deg||[]}]});
    if ((n.separation_deg||[]).length)
      charts.push({id:'c2', x:x,
        fmtY:v=>v.toFixed(0)+'°', fmtV:v=>v.toFixed(1)+'°',
        series:[{name:'상하체 분리각', color:AC, data:n.separation_deg}], zeroFloor:true});
    title = '어깨 - 골반 회전';
    body = '<div class="muted" style="font-size:13.5px">양수는 투수 쪽으로 열린 각도입니다. 골반이 먼저 열리고 어깨가 뒤따를수록 분리각이 커집니다.</div>';
  }
  else if (which === 'cs'){
    const n = (se && se.series && se.series.center_shift) || {};
    /* right_ratio = 오른발에 실린 체중(a), left_ratio = 왼발(b). 합이 10입니다.
       화면에서 오른발이 왼쪽에 있으므로(metrics 의 xr < cx < xl) 막대도 왼쪽이 오른발입니다. */
    csBar = { right:n.right_ratio||[], left:n.left_ratio||[], frame:n.frame||[],
              isR:(sm.bat_side||'R') !== 'L' };
    csTable = {id:'cs1', x:n.frame||[], fmtV:v=>v.toFixed(1),
      series:[{name:'오른발', color:'#e34a34', data:csBar.right},
              {name:'왼발',   color:'#4a6ee0', data:csBar.left}]};
    /* 상체각도 — 골반↔몸통 선의 기울기. 무게중심과 같이 봐야 의미가 살아납니다:
       체중은 앞으로 갔는데 상체가 뒤에 남았는지 같은 패턴이 여기서 읽힙니다. */
    if ((n.trunk_tilt_deg||[]).some(v => v != null))
      charts.push({id:'c1', x:n.frame||[], fmtY:v=>v.toFixed(0)+'°', fmtV:v=>v.toFixed(1)+'°',
        series:[{name:'상체각도', color:AC, data:n.trunk_tilt_deg}]});
    title = '체중이동 · 상체각도';
    body = '<div class="muted" style="font-size:13.5px">'
         + '<b style="color:var(--ink)">체중이동</b>은 두 발 사이에서 <b style="color:var(--ink)">골반 중심</b>이 '
         + '어디에 있는지를 합 10으로 나눈 값입니다. 프레임을 옮기면 그 순간의 비율이 아래 막대에 바로 나옵니다.<br>'
         + '<b style="color:var(--ink)">상체각도</b>는 골반 중심에서 몸통 중심으로 이은 선이 수직에서 기운 각도입니다 '
         + '(영상 오버레이에 그려진 그 선). <b style="color:var(--ink)">앞발 쪽으로 기울면 +, 뒷발 쪽이면 −</b>이고, '
         + '좌타·우타가 같은 부호로 비교됩니다.<br>'
         + '특정 시점이 아니라 <b style="color:var(--ink)">전 구간의 흐름</b>으로 보세요.</div>';
  }
  else if (which === 'head'){
    const n = (se && se.series && se.series.head_stability) || {};
    charts.push({id:'c1', x:n.frame||[],
      fmtY:v=>v.toFixed(0), fmtV:v=>v.toFixed(1)+'px',
      series:[{name:'머리 상하(y)', color:S1, data:n.y_px||[]}, {name:'머리 좌우(x)', color:S2, data:n.x_px||[]}]});
    title = '머리 고정';
    const std = num(sm.head_score_std_px);
    body = '<div class="muted" style="font-size:13.5px">머리 위치의 픽셀 좌표입니다. 선이 평평할수록 머리가 고정된 것입니다.'
         + (std!=null ? ' 상하 흔들림 표준편차 <b style="color:var(--ink)">'+std.toFixed(2)+'px</b>.' : '') + '</div>';
  }
  else if (which === 'hand'){
    title = '스윙 궤적 & 히팅포인트';
    body = '<div class="muted" style="font-size:13.5px">타격 손목이 지나간 자리를 영상 위에 그립니다. '
         + '프레임을 하나씩 넘기면서 궤적이 그려지는 순서를 보세요.</div>';
  }

  /* 소리로 찾은 임팩트를 차트 세로선으로. 예전 opening-frame 프록시와 달리 실제
     타격 시각이라 선을 그어도 오해가 없다. 차트 x 는 1-based 이므로 +1 한다. */
  const impF = repImpactFrame();
  if (impF != null) charts.forEach(c => { c.marker = impF + 1; c.markerLabel = '임팩트(소리)'; });

  /* ── 영상 카드 ── */
  const ovKey = DETAIL_OV[which];
  const hasOv = !!(ovKey && R.avail.has(ovKey));
  if (R.detPlayer) stopPlayer(R.detPlayer);
  const DP = newPlayer('det');
  DP.sel = new Set(hasOv ? [ovKey] : []);
  R.detPlayer = DP;

  const detChips = [];
  if (hasOv) detChips.push(ovKey);
  if (R.pose && R.avail.has('skeleton') && ovKey !== 'skeleton') detChips.push('skeleton');

  const vidCard = '<div class="card pad" style="margin-top:14px">'
    + '<div class="sect-t">영상</div>'
    + (detChips.length > 1
        ? '<div class="chips" id="detChips">' + detChips.map(k =>
            '<button class="chip'+(DP.sel.has(k)?' on':'')+'" data-dov="'+k+'">'+esc(OV_LABEL[k])+'</button>').join('')
          + '</div>'
        : '')
    + playerHTML(DP)
    + '<div class="dim" style="font-size:12px;margin-top:8px">'
    + (csBar
        ? '프레임을 옮기면 그 순간의 좌우 무게중심이 아래 막대에 바로 반영됩니다.'
        : charts.length
          ? '프레임을 옮기면 아래 그래프의 같은 시점이 함께 표시됩니다. 그래프를 눌러도 영상이 그 프레임으로 갑니다.'
          : '◀ ▶ 버튼과 슬라이더로 한 프레임씩 넘길 수 있습니다.')
    + '</div></div>';

  const cards = charts.map((c,i)=>
    '<div class="card pad"'+(charts.length>1?'':' style="margin-top:14px"')+'>'
    + (charts.length>1 ? '<div class="sect-t">'+(i===0?'회전 각도':'분리각')+'</div>' : '')
    + chartHTML(c.id)
    + '<div class="legend">' + c.series.map(s=>'<b><i style="background:'+s.color+'"></i>'+esc(s.name)+'</b>').join('')
    + (c.marker!=null?'<b><i class="dash"></i>'+esc(c.markerLabel||'임팩트')+'</b>':'') + '</div>'
    + '<button class="btn sm" style="margin-top:12px" data-tbl="'+c.id+'">표로 보기</button>'
    + '<div class="wrapx" id="tbl-'+c.id+'"></div>'
    + '</div>').join('');
  /* 그래프가 둘이면 좌우로 — 가로로 늘어뜨린 두 줄 대신 정방형에 가깝게 */
  const chartHtml = charts.length > 1 ? '<div class="chartgrid">' + cards + '</div>' : cards;

  /* 무게중심 — 좌우 비율 막대 */
  const barHtml = !csBar ? '' :
    '<div class="card pad" style="margin-top:14px">'
    + '<div class="sect-t">프레임 무게중심</div>'
    + '<div class="wbar-track">'
      + '<div class="wbar-fill"><span class="a" id="csA"></span><span class="b" id="csB"></span></div>'
      + '<div class="wbar-pill" id="csPill">- : -</div>'
    + '</div>'
    + '<div class="wbar-legend">'
      + '<b><i class="a"></i><span id="csLegA">오른발</span></b>'
      + '<b><span id="csLegB">왼발</span><i class="b"></i></b>'
    + '</div>'
    + '<div class="row" style="gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap">'
      + '<span class="dim" style="font-size:12.5px" id="csImp"></span>'
    + '</div>'
    + '<button class="btn sm" style="margin-top:12px" data-tbl="cs1">표로 보기</button>'
    + '<div class="wrapx" id="tbl-cs1"></div>'
    + '</div>';

  $('#detailRoot').innerHTML = '<div class="pad maxw" style="width:100%">'
    + '<h2 style="font-size:20px">'+esc(title)+'</h2>'
    + '<div class="dim" style="font-size:12.5px;margin:3px 0 12px">'+esc((S.rep.player||{}).name||'')+' · '+esc(S.rep.rid)+'</div>'
    + body + vidCard + barHtml + chartHtml + '</div>';

  charts.forEach(c => wireChart($('#'+c.id), c));

  const tables = charts.concat(csTable ? [csTable] : []);
  $$('#detailRoot [data-tbl]').forEach(b => b.onclick = ()=>{
    const c = tables.find(x=>x.id===b.dataset.tbl);
    if (!c) return;
    const host = $('#tbl-'+c.id);
    if (host.innerHTML){ host.innerHTML=''; b.textContent='표로 보기'; return; }
    b.textContent = '표 닫기';
    const step = Math.max(1, Math.ceil(c.x.length/60));
    let h = '<table class="tbl" style="margin-top:10px"><thead><tr><th>프레임</th>'
      + c.series.map(s=>'<th class="r">'+esc(s.name)+'</th>').join('') + '</tr></thead><tbody>';
    for (let i=0;i<c.x.length;i+=step){
      h += '<tr><td class="mono">'+c.x[i]+'</td>'
        + c.series.map(s=>{ const v=s.data[i]; return '<td class="r mono">'+(v==null||!Number.isFinite(v)?'-':(c.fmtV?c.fmtV(v):v.toFixed(1)))+'</td>'; }).join('')
        + '</tr>';
    }
    host.innerHTML = h + '</tbody></table>';
  });

  /* 영상 ↔ 그래프 동기화 */
  DP.onFrame = function(i){
    charts.forEach(c => { const h = $('#'+c.id); if (h && h._syncFrame) h._syncFrame(i + 1); });
    if (csBar) updateWeightBar(csBar, i);
  };

  if (csBar){
    const impEl = $('#csImp');
    if (impEl){
      const r = sm.weight_shift_range, f0 = sm.weight_shift_from_frame, f1 = sm.weight_shift_to_frame;
      const t0 = sm.trunk_tilt_min_deg, t1 = sm.trunk_tilt_max_deg;
      let txt = (r != null)
        ? ('체중이동 폭 ' + r + ' / 10  (프레임 ' + (f0!=null?f0:'-') + ' → ' + (f1!=null?f1:'-') + ')')
        : '체중이동을 계산하지 못했습니다.';
      if (t0 != null && t1 != null) txt += '   ·   상체각도 ' + t0 + '° ~ ' + t1 + '°';
      impEl.textContent = txt;
    }
    updateWeightBar(csBar, 0);
  }
  charts.forEach(c => {
    const h = $('#'+c.id);
    if (h) h._onPick = function(frameNo){ seekFrame(DP, frameNo - 1); };
  });

  $$('#detChips .chip[data-dov]').forEach(b => b.onclick = ()=>{
    const k = b.dataset.dov;
    if (DP.sel.has(k)) DP.sel.delete(k); else DP.sel.add(k);
    b.classList.toggle('on', DP.sel.has(k));
    if (S.rep.pose) drawOverlays(DP, true); else loadPlayer(DP);
  });

  go('detail');
  loadPlayer(DP);
}
</script>

<script>
/* ═══════════ 로그인 · 부팅 ═══════════ */
function originDefault(){
  return /^https?:$/.test(location.protocol) ? location.origin : '';
}
function normSrv(v){
  v = String(v||'').trim().replace(/\/+$/,'');
  if (!v) return '';
  if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
  if (!/:\d+$/.test(v) && !/^https:/i.test(v)) v += ':5000';
  return v;
}

function syncServerField(){
  const id = $('#inId').value.trim();
  const saved = id ? LS.get(srvKeyFor(id), '') : '';
  const cur = $('#inSrv').value.trim();
  if (saved){
    if (!cur || cur === originDefault()) $('#inSrv').value = saved;
    $('#srvTag').textContent = '· 저장된 주소 사용';
  } else {
    if (!cur) $('#inSrv').value = originDefault();
    $('#srvTag').textContent = originDefault() ? '· 이 페이지를 연 주소' : '· 직접 입력';
  }
}
$('#inId').addEventListener('input', syncServerField);
$('#inId').addEventListener('blur', syncServerField);

async function doLogin(id, pw, srv, keep){
  const server = normSrv(srv);
  if (!server) throw new Error('서버 주소를 입력하세요.');
  S.server = server;
  const r = await api('/api/login', {method:'POST', body:{id:id, pw:pw}, timeout:12000});
  if (!r || !r.ok) throw new Error((r && r.error) || '로그인 실패');
  S.user = r.user;
  LS.set(srvKeyFor(id), server);
  LS.set('lastId', id);
  if (keep) LS.set('keep', {id:id, pw:pw}); else LS.del('keep');
  await bootstrap();
}

async function bootstrap(){
  const b = await api('/api/bootstrap', {timeout:15000});
  S.teams = b.teams || [];
  S.players = b.players || [];
  S.options = b.analysis_options || [];

  $('#login').style.display = 'none';
  $('#app').classList.add('on');
  $('#whoName').textContent = (S.user && S.user.name) || '-';
  $('#whoSrv').textContent  = S.server.replace(/^https?:\/\//,'');
  $('#setSrv').value = S.server;
  $('#setIdTag').textContent = (S.user && S.user.id) || '';
  $('#verTag').textContent = VERSION;
  $('#originTag').textContent = location.host || '(로컬 파일)';

  renderHome(); go('home', true);
  pingLoop();
}

$('#btnLogin').onclick = async ()=>{
  const id = $('#inId').value.trim();
  const pw = $('#inPw').value;
  const srv = $('#inSrv').value;
  const keep = $('#inKeep').checked;
  const err = $('#loginErr'); err.textContent = '';
  if (!id){ err.textContent = '아이디를 입력하세요.'; return; }
  const btn = $('#btnLogin'); btn.disabled = true; btn.textContent = '연결 중…';
  try{ await doLogin(id, pw, srv, keep); }
  catch(e){
    err.textContent = (e.name==='AbortError' || /Failed to fetch|NetworkError/i.test(e.message))
      ? '분석PC에 연결할 수 없습니다. 주소와 같은 Wi‑Fi인지 확인하세요.'
      : e.message;
    $('#advBox').open = true;
  }
  finally{ btn.disabled = false; btn.textContent = '로그인'; }
};
$('#inPw').addEventListener('keydown', e => { if (e.key==='Enter') $('#btnLogin').click(); });
$('#inId').addEventListener('keydown', e => { if (e.key==='Enter') $('#inPw').focus(); });

$('#btnLogout').onclick = ()=>{
  LS.del('keep');
  S.user = null;
  clearTimeout(connTimer); stopPreview();
  $('#app').classList.remove('on');
  $('#login').style.display = 'grid';
  $('#inPw').value = '';
  syncServerField();
};

/* ── 설정 ── */
$('#btnSaveSrv').onclick = async ()=>{
  const srv = normSrv($('#setSrv').value);
  if (!srv){ $('#setErr').textContent = '주소를 입력하세요.'; return; }
  $('#setErr').textContent = '';
  const prev = S.server;
  S.server = srv;
  try{
    await api('/api/health', {timeout:8000});
    if (S.user) LS.set(srvKeyFor(S.user.id), srv);
    $('#whoSrv').textContent = srv.replace(/^https?:\/\//,'');
    $('#setDiag').textContent = '연결 확인됨 · ' + srv;
    await reloadPlayers();
    try{ const t = await api('/api/teams'); S.teams = t.teams || S.teams; }catch(e){}
    renderHome(); toast('저장했습니다'); pingLoop();
  }catch(e){
    S.server = prev;
    $('#setErr').textContent = '연결하지 못했습니다: ' + e.message;
  }
};
$('#btnPing').onclick = async ()=>{
  $('#setDiag').textContent = '확인 중…';
  const t0 = Date.now();
  try{ await api('/api/health', {timeout:8000}); $('#setDiag').textContent = '정상 · 응답 ' + (Date.now()-t0) + 'ms'; setConn('ok','연결됨'); }
  catch(e){ $('#setDiag').textContent = '실패: ' + e.message; setConn('bad','서버 없음'); }
};
$('#btnClearCache').onclick = async ()=>{
  if (!S.rep.pid){ toast('먼저 리포트를 한 번 열어주세요'); return; }
  try{ const r = await api('/api/overlay_video/clear_cache', {method:'POST', body:{player_id:S.rep.pid, report_id:S.rep.rid}});
       toast(r.removed + '개 삭제했습니다'); }
  catch(e){ toast('실패: ' + e.message); }
};

/* ── 부팅 ── */
(async function init(){
  const lastId = LS.get('lastId','');
  if (lastId) $('#inId').value = lastId;
  syncServerField();
  $('#loginFoot').textContent = originDefault()
    ? '분석PC에서 연 페이지입니다. 주소는 자동으로 채워집니다.'
    : '로컬 파일로 열었습니다. 서버 주소를 직접 입력하세요.';

  const keep = LS.get('keep', null);
  if (keep && keep.id){
    $('#inKeep').checked = true;
    $('#inId').value = keep.id;
    syncServerField();
    const srv = LS.get(srvKeyFor(keep.id), '') || originDefault();
    try{ await doLogin(keep.id, keep.pw, srv, true); return; }
    catch(e){ $('#loginErr').textContent = '자동 로그인 실패 — 다시 로그인해주세요.'; }
  }
  setTimeout(()=>{ if (!$('#inId').value) $('#inId').focus(); else $('#inPw').focus(); }, 60);
})();
</script>

<!-- ══════════ 공개 정적 모드 ══════════
     arcmo_web.html 원본은 그대로입니다. 아래에서 통신 함수(url·api)만 정적 파일
     읽기로 바꾸고, 쓰기 기능(촬영·분석·선수 편집)을 잠급니다. -->
<style>
#login{display:none!important}
/* 읽기 전용 — 촬영·분석·편집·서버설정으로 가는 길을 전부 막습니다. */
.navitem[data-go="manage"],.navitem[data-go="analysis"],.navitem[data-go="settings"],
#btnLogout,#connBox,#hpAnalyze,#hpEdit,
.fcard[data-f="manage"],.fcard[data-f="analysis"]{display:none!important}
#pubBar{
  position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:8px 14px;font-size:12.5px;line-height:1.5;
  background:var(--surface2);border-bottom:1px solid var(--line);color:var(--ink2);
}
#pubBar b{color:var(--ink);font-weight:700}
#pubBar .sp{margin-left:auto;display:flex;gap:8px}
#pubBar .lk{
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;
}
#pubBar .lk:hover{background:var(--surface3)}
</style>
<script>
'use strict';
(function(){
  /* 사이트 루트 — 하위 경로(GitHub Pages 프로젝트 사이트)에서도 맞도록 계산합니다. */
  var BASE = location.pathname.replace(/[^/]*$/, '');
  var MF = null;

  function dataURL(rel){ return BASE + 'data/' + rel; }

  function httpErr(status){
    var e = new Error('HTTP ' + status); e.status = status; return e;
  }
  async function getJSON(u){
    var r = await fetch(u, {cache:'no-store'});
    if (!r.ok) throw httpErr(r.status);
    return await r.json();
  }
  function readOnly(){
    var e = new Error('공개 리포트입니다 — 촬영·분석·편집은 분석PC에서 해주세요.');
    e.status = 403; return e;
  }

  /* ── 영상 주소 ── */
  var origUrl = window.url;
  window.url = function(path){
    var m = /^\/api\/(report_video|overlay_video)\?(.*)$/.exec(path || '');
    if (m){
      var q = new URLSearchParams(m[2]);
      var pid = q.get('player_id'), rid = q.get('report_id');
      return dataURL('reports/' + encodeURIComponent(pid) + '/' + encodeURIComponent(rid) + '/video.mp4');
    }
    if (/^\/video_feed/.test(path || '')) return '';
    return BASE + String(path || '').replace(/^\//, '');
  };

  /* ── API ── */
  window.api = async function(path, opts){
    opts = opts || {};
    var method = (opts.method || 'GET').toUpperCase();
    var q = path.indexOf('?');
    var bare = q < 0 ? path : path.slice(0, q);
    var args = new URLSearchParams(q < 0 ? '' : path.slice(q + 1));

    if (method !== 'GET' && bare !== '/api/login') throw readOnly();

    if (bare === '/api/health')  return {ok:true, static:true, time: MF && MF.generated_at};
    if (bare === '/api/login')   return {ok:true, user: MF.user};
    if (bare === '/api/bootstrap') {
      return {teams: MF.teams, players: MF.players,
              analysis_options: MF.analysis_options, overlay_keys: MF.overlay_keys};
    }
    if (bare === '/api/teams')   return {teams: MF.teams};
    if (bare === '/api/players') return {players: MF.players};

    var mr = /^\/api\/players\/([^/]+)\/reports$/.exec(bare);
    if (mr){
      var pid = decodeURIComponent(mr[1]);
      return {player_id: pid, reports: MF.reports.filter(function(r){ return r.player_id === pid; })};
    }

    if (bare === '/api/pose'){
      var pp = args.get('player_id'), rr = args.get('report_id');
      if (!hasAsset(pp, rr, 'pose')) throw httpErr(404);
      return await getJSON(dataURL('reports/' + pp + '/' + rr + '/pose.json'));
    }

    var mp = /^\/reports\/([^/]+)\/([^/]+)\/(summary|series|ready)$/.exec(bare);
    if (mp){
      var p2 = decodeURIComponent(mp[1]), r2 = decodeURIComponent(mp[2]), what = mp[3];
      if (what === 'ready') return {is_complete:true, steps:{}, errors:{}};
      if (what === 'series' && !hasAsset(p2, r2, 'series')) throw httpErr(404);
      var name = what === 'summary' ? 'summary.json' : 'series.json';
      return await getJSON(dataURL('reports/' + p2 + '/' + r2 + '/' + name));
    }

    throw httpErr(404);
  };

  function hasAsset(pid, rid, key){
    var a = MF && MF.assets && MF.assets[pid + '/' + rid];
    return !!(a && a[key]);
  }

  /* ── 상단 안내줄 ── */
  function mountBar(){
    if (document.getElementById('pubBar')) return;
    var bar = document.createElement('div');
    bar.id = 'pubBar';
    bar.innerHTML =
      '<span><b>' + esc(MF.title) + '</b></span>'
      + '<span>' + esc(MF.note || '분석PC에서 만든 리포트를 그대로 굳힌 읽기 전용 사본입니다.') + '</span>'
      + '<span class="sp"><span style="align-self:center">'
      + esc((MF.generated_at || '').slice(0, 16).replace('T', ' ')) + ' 기준</span>'
      + '<button class="lk" id="pubLink">이 리포트 링크 복사</button></span>';
    var main = document.querySelector('main');
    main.parentNode.insertBefore(bar, main);
    document.getElementById('pubLink').onclick = function(){
      var u = location.origin + location.pathname;
      if (S.rep && S.rep.pid) u += '?p=' + encodeURIComponent(S.rep.pid) + '&r=' + encodeURIComponent(S.rep.rid);
      try{ navigator.clipboard.writeText(u); toast('링크를 복사했습니다'); }
      catch(e){ prompt('링크', u); }
    };
  }

  /* ── 리포트를 열 때 주소창에도 남깁니다 (공유용) ── */
  var origOpen = window.openReport;
  window.openReport = function(pid, rid){
    try{
      history.replaceState(null, '', location.pathname
        + '?p=' + encodeURIComponent(pid) + '&r=' + encodeURIComponent(rid));
    }catch(e){}
    return origOpen.apply(this, arguments);
  };

  /* ── 부팅 ── */
  (async function(){
    try{
      MF = await getJSON(dataURL('manifest.json'));
    }catch(e){
      document.body.innerHTML = '<div style="padding:40px;font:15px/1.6 system-ui">'
        + 'data/manifest.json 을 읽지 못했습니다.<br>'
        + '정적 서버로 열어야 합니다 — <code>python -m http.server 8080</code>'
        + '</div>';
      return;
    }
    document.title = MF.title || document.title;
    S.server = '';
    S.user = MF.user;
    await bootstrap();
    mountBar();

    var q = new URLSearchParams(location.search);
    var pid = q.get('p'), rid = q.get('r');
    var first = MF.reports[0];
    if (!pid && first){ pid = first.player_id; }

    var p = pid && playerById(pid);
    if (p){
      S.home.team = p.team;
      renderHome();
      await selectHomePlayer(p.id);
      if (rid) openReport(pid, rid);
    }
  })();
})();
</script>
